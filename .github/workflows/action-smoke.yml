          context; expect rc=1; says 'the head moved after the review'

          export EVENT_NAME=issue_comment
          comment created ',"pull_request":{"url":"x"}' 'godwit apply' OWNER
          GH_STUB_PR="{\"head\":{\"sha\":\"${OTHER_SHA}\"},\"state\":\"open\",\"merged\":false,\"user\":{\"login\":\"pr-author\"}}" context; expect rc=1
          answered 'is not the head of pull request #7' godwit/applied "${OTHER_SHA}"
          GH_STUB_PR="{\"head\":{\"sha\":\"${HEAD_SHA}\"},\"state\":\"closed\",\"merged\":true,\"user\":{\"login\":\"pr-author\"}}" context; expect rc=1
          answered 'nothing to apply' godwit/applied
          comment created ',"pull_request":{"url":"x"}' 'godwit revert' OWNER
          GH_STUB_PR="{\"head\":{\"sha\":\"${HEAD_SHA}\"},\"state\":\"closed\",\"merged\":true,\"user\":{\"login\":\"pr-author\"}}" COMMAND=revert context; expect rc=1
          answered 'was merged' godwit/applied
          GH_STUB_PR="{\"head\":{\"sha\":\"${HEAD_SHA}\"},\"state\":\"closed\",\"merged\":false,\"user\":{\"login\":\"pr-author\"}}" COMMAND=revert context; expect rc=0; expect skipped=false
          EVENT_NAME=push context; expect rc=1; mute; says 'names no pull request to answer on'
          APPLY_ON=never context; expect rc=2; answered 'enables nothing' godwit/applied
