          comment created ',"pull_request":{"url":"x"}' 'godwit plan' OWNER
          GH_STUB_PERMISSION="read" context; expect rc=1; says "has permission 'read'"
          answered "has permission 'read'" godwit/plan
          REQUIRE_APPROVAL=true GH_STUB_REVIEWS='[]' context; expect rc=0; expect skipped=false
          APPLY_ON=approve context; expect rc=0; expect skipped=false
          MODE=apply-on-merge context; expect rc=0; expect skipped=false
          EVENT_NAME=pull_request_review review commented 'godwit plan --rollout expand-contract' MEMBER
          EVENT_NAME=pull_request_review context; expect rc=0; expect skipped=false; expect rollout=expand-contract
          EVENT_NAME=pull_request_review review approved '' MEMBER
          EVENT_NAME=pull_request_review APPLY_ON=comment,approve context; expect rc=0; expect skipped=true
          export COMMAND=apply

          export EVENT_NAME=pull_request_review COMMAND=apply APPLY_ON=comment
          review approved '' COLLABORATOR
          context; expect rc=0; expect skipped=true
          APPLY_ON=approve context; expect rc=0; expect skipped=false; expect "head-sha=${HEAD_SHA}"
          APPLY_ON=comment,approve context; expect rc=0; expect skipped=false
          review commented 'godwit apply' MEMBER
          context; expect rc=0; expect skipped=false
          review commented 'Nice. Once CI is green:\ngodwit apply' MEMBER
          context; expect rc=0; expect skipped=true
          review approved 'Nice. Once CI is green:\ngodwit apply' MEMBER
          context; expect rc=0; expect skipped=true
          review approved 'Nice. Once CI is green:\ngodwit apply' MEMBER
          APPLY_ON=approve context; expect rc=0; expect skipped=false
          review approved '' NONE
          APPLY_ON=approve context; expect rc=1
          review changes_requested '' OWNER
          APPLY_ON=approve context; expect rc=0; expect skipped=true
          review approved '' COLLABORATOR "${OTHER_SHA}"
          APPLY_ON=approve context; expect rc=1; says 'the head moved after the review'
          answered 'the head moved after the review' godwit/applied
