# The ordinary shape: ingress-nginx, a Secret created by hand, no Gateway API CRDs.
replicaCount: 2

image:
  tag: sha-1a2b3c4
  pullPolicy: IfNotPresent

existingSecret:
  name: godwit

serve:
  ui:
    enabled: true
    origins: ["https://godwit.example.com"]

notifications:
  publicUrl: https://godwit.example.com

ingress:
  enabled: true
  className: nginx
  annotations:
    # No backend-protocol GRPC: grpc_pass applies to the whole server block and would break /ui.
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: godwit.example.com
      paths:
        - path: /ui
          pathType: Prefix
        - path: /godwit.v1.GodwitService
          pathType: Prefix
  tls:
    - secretName: godwit-tls
      hosts: [godwit.example.com]

serviceMonitor:
  enabled: true

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: '{{ include "godwit.fullname" . }}-alerts'
    data:
      note: rendered with the release context
