# PreSync hook: apply the expand phase of the app's migrations before the new
# pods roll out. Exits 0 on succeeded/awaiting_contract, 1 otherwise, which
# fails the sync. The migrations come from a ConfigMap rendered from the app's
# db/migrations directory (see README.md for the Helm and Kustomize snippets).
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: godwit
          image: ghcr.io/samuelmolling/godwit:main
          args:
            - migrate
            - --target=orders
            - --dir=/migrations
            - --rollout=expand-contract
          env:
            - name: GODWIT_SERVER
              value: http://godwit.godwit.svc:8474
            - name: GODWIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orders-godwit
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: orders-migrations
