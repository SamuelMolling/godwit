name: godwit
description: Lint, plan, apply, confirm, verify, revert or generate plain-SQL PostgreSQL migrations with godwit
author: Samuel Molling

inputs:
  command:
    description: "What to run: lint, plan, apply, confirm, verify, revert, migrate or diff"
    required: true
  mode:
    description: "apply-on-pr (default: apply runs from the pull request, verify on push, migrate is refused) or apply-on-merge (migrate runs on push; apply, confirm and revert are refused)"
    default: apply-on-pr
  apply-on:
    description: "What triggers apply: comment (a '/godwit apply' comment or review), approve (an approved review), or comment,approve"
    default: comment
  allowed-associations:
    description: "author_association values allowed to command apply, confirm or revert from a comment or review"
    default: OWNER,MEMBER,COLLABORATOR
  dir:
    description: "Migration directory (default: dir from godwit.yaml, else migrations)"
    default: ""
  base:
    description: "Git ref; lint only checks migrations added since it (empty checks every migration)"
    default: origin/main
  ack:
    description: "Comma-separated hazard codes to acknowledge, e.g. H001,H003 (revert: the codes in the down files, e.g. H002)"
    default: ""
  server:
    description: "godwit service URL (lint, plan, apply, verify, revert, migrate, diff; lint uses it for the schema_source check, warning W002 without it; default: server from godwit.yaml or GODWIT_SERVER)"
    default: ""
  token:
    description: "Bearer token for the service (lint, plan, verify, diff: read scope; apply, confirm, revert, migrate: pipeline scope)"
    default: ""
  target:
    description: "Target name (lint, plan, apply, verify, migrate, diff; confirm and revert narrow the run search with it; default: target from godwit.yaml). With a target, plan stores the admitted plan on the service"
    default: ""
  rollout:
    description: "Rollout policy for plan, apply and migrate: direct or expand-contract (default: godwit.yaml, else direct)"
    default: ""
  dry-run:
    description: "With migrate: ask the service for the admitted plan without persisting it and without queueing a run (command: plan persists it). With diff: report the migration without writing files"
    default: "false"
  schema:
    description: "diff: file holding the whole desired database as DDL"
    default: ""
  prisma:
    description: "diff: Prisma schema (schema.prisma) rendered to DDL by the Prisma CLI, which must be installed in the checkout (npx prisma)"
    default: ""
  prisma-bin:
    description: "diff: command line that runs the Prisma CLI (default: npx prisma, or GODWIT_PRISMA_BIN)"
    default: ""
  name:
    description: "diff: migration name, snake_case; the files are <timestamp>_<name>.{up,down}.sql in dir"
    default: ""
  source:
    description: "Provenance recorded on the plan or run (default: <repository>@<pull request head sha, else sha>[:<dir>])"
    default: ""
  comment:
    description: "Post the report as one sticky pull request comment (needs pull-requests: write)"
    default: "true"
  comment-on-push:
    description: "On push events, post the migrate outcome, or a failed verify, on the pull request(s) merged by the commit (needs pull-requests: write)"
    default: "true"
  github-token:
    description: "Token used to read the pull request, post the comment and set the godwit/applied status"
    default: ${{ github.token }}
  go-version:
    description: "Go version used to build godwit (cgo: libpg_query)"
    default: "1.26"

outputs:
  run-id:
    description: "Run id created by apply, migrate or revert (the last revert run)"
    value: ${{ steps.godwit.outputs.run-id }}
  plan-id:
    description: "Id of the plan stored by plan, or bound by apply or migrate (empty for an implicit run)"
    value: ${{ steps.godwit.outputs.plan-id }}
  plan-key:
    description: "Key of the plan stored by plan"
    value: ${{ steps.godwit.outputs.plan-key }}
  stale:
    description: "true when apply or migrate was refused because the stored plan is stale or required (exit 3)"
    value: ${{ steps.godwit.outputs.stale }}
  phase:
    description: "awaiting-contract when the run applied its expand phase and holds the contract one, contract when the contract phase ran, empty otherwise"
    value: ${{ steps.godwit.outputs.phase }}
  pending:
    description: "Number of migrations verify found not applied"
    value: ${{ steps.godwit.outputs.pending }}
  blocking:
    description: "Number of blocking lint findings"
    value: ${{ steps.godwit.outputs.blocking }}
  pr-number:
    description: "Pull request apply or revert acted on (or the pull request of a pull_request event)"
    value: ${{ steps.context.outputs.pr-number }}
  head-sha:
    description: "Head commit of that pull request; apply sets the godwit/applied status on it"
    value: ${{ steps.context.outputs.head-sha }}
  skipped:
    description: "true when the event did not carry a command for apply, confirm or revert (nothing ran)"
    value: ${{ steps.context.outputs.skipped }}
  changed:
    description: "true when diff found the target and the desired schema differ"
    value: ${{ steps.godwit.outputs.changed }}
  files:
    description: "Space-separated paths of the up and down files diff wrote"
    value: ${{ steps.godwit.outputs.files }}
  summary-path:
    description: "Path of the markdown report"
    value: ${{ steps.godwit.outputs.summary-path }}

runs:
  using: composite
  steps:
    - name: Read the event
      id: context
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMAND: ${{ inputs.command }}
        MODE: ${{ inputs.mode }}
        DRY_RUN: ${{ inputs.dry-run }}
        APPLY_ON: ${{ inputs.apply-on }}
        ALLOWED_ASSOCIATIONS: ${{ inputs.allowed-associations }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PATH: ${{ github.event_path }}
        REPOSITORY: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: "${{ github.action_path }}/scripts/action-context.sh"

    - uses: actions/setup-go@v5
      if: ${{ steps.context.outputs.skipped != 'true' }}
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build godwit
      if: ${{ steps.context.outputs.skipped != 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        CGO_ENABLED=1 go build -o "${RUNNER_TEMP}/godwit" ./cmd/godwit

    - name: Run godwit ${{ inputs.command }}
      id: godwit
      if: ${{ steps.context.outputs.skipped != 'true' }}
      shell: bash
      env:
        GODWIT_BIN: ${{ runner.temp }}/godwit
        GH_TOKEN: ${{ inputs.github-token }}
        COMMAND: ${{ inputs.command }}
        DIR: ${{ inputs.dir }}
        BASE: ${{ inputs.base }}
        ACK: ${{ inputs.ack }}
        SERVER: ${{ inputs.server }}
        TARGET: ${{ inputs.target }}
        ROLLOUT: ${{ inputs.rollout }}
        DRY_RUN: ${{ inputs.dry-run }}
        SOURCE: ${{ inputs.source }}
        SCHEMA: ${{ inputs.schema }}
        PRISMA: ${{ inputs.prisma }}
        PRISMA_BIN: ${{ inputs.prisma-bin }}
        NAME: ${{ inputs.name }}
        GODWIT_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.context.outputs.pr-number }}
        HEAD_SHA: ${{ steps.context.outputs.head-sha }}
      run: "${{ github.action_path }}/scripts/action-run.sh"

    - name: Comment on the pull request and set the status
      if: ${{ steps.context.outputs.skipped != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMAND: ${{ inputs.command }}
        DRY_RUN: ${{ inputs.dry-run }}
        COMMENT: ${{ inputs.comment }}
        COMMENT_ON_PUSH: ${{ inputs.comment-on-push }}
        SUMMARY: ${{ steps.godwit.outputs.summary-path }}
        STATUS: ${{ steps.godwit.outputs.status }}
        STALE: ${{ steps.godwit.outputs.stale }}
        PHASE: ${{ steps.godwit.outputs.phase }}
        RUN_ID: ${{ steps.godwit.outputs.run-id }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        SHA: ${{ github.sha }}
        PR_NUMBER: ${{ steps.context.outputs.pr-number }}
        HEAD_SHA: ${{ steps.context.outputs.head-sha }}
        SKIPPED: ${{ steps.context.outputs.skipped }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: "${{ github.action_path }}/scripts/action-comment.sh"

    - name: Propagate the exit status
      shell: bash
      env:
        STATUS: ${{ steps.godwit.outputs.status }}
      run: |
        set -euo pipefail
        if [ -n "${STATUS}" ] && [ "${STATUS}" != "0" ]; then
          exit "${STATUS}"
        fi
