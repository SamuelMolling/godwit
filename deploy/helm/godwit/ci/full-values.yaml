replicaCount: 3
commonLabels:
  app.kubernetes.io/part-of: platform
image:
  repository: registry.example.com/platform/godwit
  tag: 0.0.1-rc1
imagePullSecrets:
  - name: registry-pull
existingSecret:
  name: godwit-credentials
  keys:
    masterKey: master-key
    masterKeyPrevious: master-key-previous
    tokens: tokens
    storeDSN: store-dsn
    scratchDSN: scratch-dsn
    slackToken: slack-token
    uiUser: ui-user
    uiPassword: ui-password
serve:
  port: 9000
  keyProvider:
    name: env
    key: ""
  driftInterval: 1m
  skipValidation: true
  scratch:
    enabled: true
    template: godwit_scratch_template
  logFormat: text
  logLevel: debug
  ui:
    enabled: true
    basicAuth: true
    scope: read
    origins: ["https://godwit.example.com"]
  extraArgs: ["--drift-interval=2m"]
vault:
  addr: https://vault.example.com
  k8sRole: godwit
  k8sMount: kubernetes-prod
  tokenSecret:
    name: godwit-vault
    key: token
notifications:
  webhookUrl: https://hooks.example.com/godwit
  publicUrl: https://godwit.example.com
  slack:
    channel: "#dbre-migrations"
    mode: edit
extraEnv:
  - name: HTTPS_PROXY
    value: http://proxy:3128
extraEnvFrom:
  - secretRef:
      name: godwit-extra
extraVolumes:
  - name: orders-dsn
    secret:
      secretName: orders-dsn
extraVolumeMounts:
  - name: orders-dsn
    mountPath: /secrets/orders
    readOnly: true
initContainers:
  - name: wait-for-store
    image: busybox:1.36
    command: ["sh", "-c", "sleep 1"]
extraContainers:
  - name: sidecar
    image: busybox:1.36
    command: ["sh", "-c", "sleep infinity"]
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: godwit-extra-map
    data:
      key: value
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ include "godwit.fullname" . }}-extra-string
      labels:
        {{- include "godwit.labels" . | nindent 4 }}
    data:
      namespace: {{ .Release.Namespace }}
serviceAccount:
  name: godwit-sa
  annotations:
    iam.gke.io/gcp-service-account: godwit@project.iam.gserviceaccount.com
podAnnotations:
  prometheus.io/scrape: "false"
podLabels:
  team: dbre
service:
  type: ClusterIP
  port: 80
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: godwit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: godwit-tls
      hosts: [godwit.example.com]
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 5s
  labels:
    release: kube-prometheus-stack
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
podDisruptionBudget:
  minAvailable: 2
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: godwit
podAntiAffinity: hard
priorityClassName: platform-critical
revisionHistoryLimit: 3
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
httpRoute:
  enabled: true
  parentRefs:
    - name: internal
      namespace: gateway-system
      sectionName: https
  hostnames:
    - godwit.example.com
  labels:
    gateway: internal
  annotations:
    external-dns.alpha.kubernetes.io/hostname: godwit.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: godwit-canary
          port: 80
          weight: 10
targets:
  enabled: true
  server: http://godwit.godwit.svc:9000
  tokenSecret:
    name: godwit-admin
    key: GODWIT_ADMIN_TOKEN
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  podAnnotations:
    sidecar.istio.io/inject: "false"
  podLabels:
    job: register-targets
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  extraEnv:
    - name: HTTPS_PROXY
      value: http://proxy:3128
  extraVolumes:
    - name: targets
      secret:
        secretName: godwit-targets
  extraVolumeMounts:
    - name: targets
      mountPath: /secrets/targets
      readOnly: true
  list:
    - name: orders
      provider: vault
      vaultPath: secret/data/orders/db
      vaultTemplate: 'postgres://{{username}}:{{password}}@orders-db:5432/orders'
      lockTimeout: 5s
      statementTimeout: 15m
      requirePlan: true
      searchPath: app,public
      keepOld: false
      extraArgs: ["--json"]
    - name: billing
      provider: kubernetes
      secretPath: /secrets/targets/billing
    - name: legacy
      provider: static
      dsnSecret:
        name: legacy-dsn
        key: dsn
