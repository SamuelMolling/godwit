# No ingress of any kind: Service-only access, a Vault Agent sidecar, and an unauthenticated UI.
replicaCount: 2

image:
  tag: sha-1a2b3c4
  pullPolicy: IfNotPresent

existingSecret:
  name: godwit

serve:
  ui:
    enabled: true
    auth: false
    anonymousScope: operator

serviceAccount:
  create: true
  automountServiceAccountToken: true

initContainers:
  - name: vault-agent-init
    image: hashicorp/vault:1.17
    args: ["agent", "-config=/etc/vault/agent.hcl", "-exit-after-auth"]
    volumeMounts:
      - name: vault-agent-config
        mountPath: /etc/vault
      - name: target-secrets
        mountPath: /secrets

extraContainers:
  - name: vault-agent
    image: hashicorp/vault:1.17
    args: ["agent", "-config=/etc/vault/agent.hcl"]
    volumeMounts:
      - name: vault-agent-config
        mountPath: /etc/vault
      - name: target-secrets
        mountPath: /secrets

extraVolumes:
  - name: vault-agent-config
    configMap:
      name: godwit-vault-agent
  - name: target-secrets
    emptyDir:
      medium: Memory

extraVolumeMounts:
  - name: target-secrets
    mountPath: /secrets
    readOnly: true

ingress:
  enabled: false

httpRoute:
  enabled: false
