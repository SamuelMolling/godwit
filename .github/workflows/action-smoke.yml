          answered 'refused on pull_request_target' godwit/applied
          COMMAND=confirm EVENT_NAME=pull_request_target context; expect rc=2
          COMMAND=revert EVENT_NAME=pull_request_target context; expect rc=2
          MODE=apply-on-merge COMMAND=migrate EVENT_NAME=pull_request_target context; expect rc=2; says 'refused on pull_request_target'
          answered 'refused on pull_request_target' godwit/applied
          MODE=apply-on-merge COMMAND=migrate EVENT_NAME=pull_request_target DRY_RUN=true context; expect rc=0; expect skipped=false

      - name: Check outputs
        shell: bash
        env:
          BLOCKING_OUTCOME: ${{ steps.blocking.outcome }}
          BLOCKING_COUNT: ${{ steps.blocking.outputs.blocking }}
          LINT_COUNT: ${{ steps.lint.outputs.blocking }}
          LINT_SUMMARY: ${{ steps.lint.outputs.summary-path }}
          PLAN_SUMMARY: ${{ steps.plan.outputs.summary-path }}
          PLAN_ID: ${{ steps.plan.outputs.plan-id }}
          PLAN_VERDICT: ${{ steps.plan.outputs.plan-verdict }}
          PLAN_HAZARDS: ${{ steps.plan.outputs.plan-hazards }}
          UNACKED_OUTCOME: ${{ steps.unacked.outcome }}
          UNACKED_VERDICT: ${{ steps.unacked.outputs.plan-verdict }}
          UNACKED_SUMMARY: ${{ steps.unacked.outputs.summary-path }}
          STORED_VERDICT: ${{ steps.stored.outputs.plan-verdict }}
          STORED_HAZARDS: ${{ steps.stored.outputs.plan-hazards }}
          DRYRUN_VERDICT: ${{ steps.dryrun.outputs.plan-verdict }}
          DRYRUN_HAZARDS: ${{ steps.dryrun.outputs.plan-hazards }}
          TWOPLAN_VERDICT: ${{ steps.twoplan.outputs.plan-verdict }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_SKIPPED: ${{ steps.gate.outputs.skipped }}
          STORED_ID: ${{ steps.stored.outputs.plan-id }}
          STORED_KEY: ${{ steps.stored.outputs.plan-key }}
          STORED_SUMMARY: ${{ steps.stored.outputs.summary-path }}
          STALE_OUTCOME: ${{ steps.stale.outcome }}
          STALE: ${{ steps.stale.outputs.stale }}
          STALE_RUN: ${{ steps.stale.outputs.run-id }}
          STALE_SUMMARY: ${{ steps.stale.outputs.summary-path }}
          STALE_HEAD: ${{ steps.stale.outputs.head-sha }}
          REPLAN_ID: ${{ steps.replan.outputs.plan-id }}
          REPLAN_KEY: ${{ steps.replan.outputs.plan-key }}
          APPLY_STALE: ${{ steps.apply.outputs.stale }}
          APPLY_RUN: ${{ steps.apply.outputs.run-id }}
          APPLY_PLAN: ${{ steps.apply.outputs.plan-id }}
          APPLY_SUMMARY: ${{ steps.apply.outputs.summary-path }}
          APPLY_PR: ${{ steps.apply.outputs.pr-number }}
          APPLY_HEAD: ${{ steps.apply.outputs.head-sha }}
          VERIFIED_PENDING: ${{ steps.verified.outputs.pending }}
          VERIFIED_SUMMARY: ${{ steps.verified.outputs.summary-path }}
          REVERT_RUN: ${{ steps.revert.outputs.run-id }}
          REVERT_SUMMARY: ${{ steps.revert.outputs.summary-path }}
          DIFFDRY_CHANGED: ${{ steps.diffdry.outputs.changed }}
          DIFFDRY_FILES: ${{ steps.diffdry.outputs.files }}
          DIFFDRY_SUMMARY: ${{ steps.diffdry.outputs.summary-path }}
          DIFF_CHANGED: ${{ steps.diff.outputs.changed }}
          DIFF_FILES: ${{ steps.diff.outputs.files }}
          DIFF_SUMMARY: ${{ steps.diff.outputs.summary-path }}
          TWOPLAN_ID: ${{ steps.twoplan.outputs.plan-id }}
          EXPAND_PHASE: ${{ steps.expand.outputs.phase }}
          EXPAND_RUN: ${{ steps.expand.outputs.run-id }}
          EXPAND_PLAN: ${{ steps.expand.outputs.plan-id }}
          EXPAND_SUMMARY: ${{ steps.expand.outputs.summary-path }}
          CONTRACT_PHASE: ${{ steps.contract.outputs.phase }}
          CONTRACT_RUN: ${{ steps.contract.outputs.run-id }}
          CONTRACT_SUMMARY: ${{ steps.contract.outputs.summary-path }}
          TWOVERIFY_PENDING: ${{ steps.twoverify.outputs.pending }}
          TWOVERIFY_SUMMARY: ${{ steps.twoverify.outputs.summary-path }}
          NOTHING_OUTCOME: ${{ steps.nothing.outcome }}
          NOTHING_PHASE: ${{ steps.nothing.outputs.phase }}
          NOTHING_RUN: ${{ steps.nothing.outputs.run-id }}
          NOTHING_SUMMARY: ${{ steps.nothing.outputs.summary-path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          absent() { if grep -q "$1" "${GH_STUB_LOG}"; then exit 1; fi; }
          test "${BLOCKING_OUTCOME}" = "failure"
          test "${BLOCKING_COUNT}" = "1"
          test "${LINT_COUNT}" = "0"
          grep -q '^## godwit lint$' "${LINT_SUMMARY}"
          grep -q 'no unacknowledged hazards' "${LINT_SUMMARY}"
          grep -q '^## godwit plan$' "${PLAN_SUMMARY}"
          grep -q '^\*\*H001\*\* CREATE INDEX without CONCURRENTLY' "${PLAN_SUMMARY}"
          test -z "${PLAN_ID}"
          test "${PLAN_VERDICT}" = "offline plan; no target was consulted"
          test -z "${PLAN_HAZARDS}"
          test "${GATE_OUTCOME}" = "failure"
          test -z "${GATE_SKIPPED}"

          test "${UNACKED_OUTCOME}" = "failure"
          test -z "${UNACKED_VERDICT}"
          grep -q 'unacknowledged hazards' "${UNACKED_SUMMARY}"
          test "${STORED_VERDICT}" = "2 to apply, 1 hazard to acknowledge"
          test "${STORED_HAZARDS}" = "1"
          test "${DRYRUN_VERDICT}" = "nothing to apply"
          test "${DRYRUN_HAZARDS}" = "0"
          test "${TWOPLAN_VERDICT}" = "2 to apply"

          test -n "${STORED_ID}"
          test -n "${STORED_KEY}"
          grep -q '^## godwit plan$' "${STORED_SUMMARY}"
          grep -q "^<!-- godwit-plan-id: ${STORED_ID} -->$" "${STORED_SUMMARY}"
          grep -q "^<!-- godwit-plan-key: ${STORED_KEY} -->$" "${STORED_SUMMARY}"
          grep -q '^```diff$' "${STORED_SUMMARY}"
          grep -q '^+ 20260901120000_users  ' "${STORED_SUMMARY}"
          absent_in() { if grep -q "$1" "$2"; then exit 1; fi; }
          absent_in '^key: ' "${STORED_SUMMARY}"
          absent_in '^observed: ' "${STORED_SUMMARY}"
          absent_in '^validation: ' "${STORED_SUMMARY}"
          absent_in 'this run will not execute' "${STORED_SUMMARY}"

          test "${STALE_OUTCOME}" = "failure"
          test "${STALE}" = "true"
          test -z "${STALE_RUN}"
          test "${STALE_HEAD}" = "${HEAD_SHA}"
          grep -q '^## godwit apply$' "${STALE_SUMMARY}"
          grep -q 'is stale' "${STALE_SUMMARY}"
          grep -q 'reason : schema' "${STALE_SUMMARY}"
          grep -q '+ column public.rogue.id integer' "${STALE_SUMMARY}"

          test "${REPLAN_KEY}" = "${STORED_KEY}"
          test "${REPLAN_ID}" != "${STORED_ID}"
          test "${APPLY_STALE}" = "false"
          test -n "${APPLY_RUN}"
          test "${APPLY_PLAN}" = "${REPLAN_ID}"
          test "${APPLY_PR}" = "${PR_NUMBER}"
          test "${APPLY_HEAD}" = "${HEAD_SHA}"
          grep -q "^run \`${APPLY_RUN}\`: \*\*succeeded\*\* (plan \`${REPLAN_ID}\`) at \[\`${HEAD_SHA:0:7}\`\](" "${APPLY_SUMMARY}"

          test "${VERIFIED_PENDING}" = "0"
          grep -q "^target \`app\`: 2 migrations, all applied$" "${VERIFIED_SUMMARY}"

          test -n "${REVERT_RUN}"
          test "${REVERT_RUN}" != "${APPLY_RUN}"
          grep -q "^run \`${REVERT_RUN}\` reverts \`${APPLY_RUN}\`: \*\*succeeded\*\* (implicit plan)$" "${REVERT_SUMMARY}"

          test "${DIFFDRY_CHANGED}" = "true"
          test -z "${DIFFDRY_FILES}"
          grep -q '^## godwit diff$' "${DIFFDRY_SUMMARY}"
          grep -q "^target \`app\` -> \`testdata/action/schema.sql\`: [0-9]* statement(s)$" "${DIFFDRY_SUMMARY}"
          grep -q 'CREATE TABLE' "${DIFFDRY_SUMMARY}"
          absent_in '^wrote ' "${DIFFDRY_SUMMARY}"
          test "${DIFF_CHANGED}" = "true"
          # shellcheck disable=SC2086
          set -- ${DIFF_FILES}
          test "$#" = "2"
          test -s "$1"
          test -s "$2"
          case "$1" in "${RUNNER_TEMP}"/diff/*_users_from_schema.up.sql) ;; *) exit 1 ;; esac
          case "$2" in "${RUNNER_TEMP}"/diff/*_users_from_schema.down.sql) ;; *) exit 1 ;; esac
          grep -q 'CREATE TABLE' "$1"
          grep -q 'DROP TABLE' "$2"
          grep -q '^drift (' "${DIFF_SUMMARY}"
          grep -q "^wrote \`$1\`, \`$2\`$" "${DIFF_SUMMARY}"

          test -n "${TWOPLAN_ID}"
          test "${EXPAND_PLAN}" = "${TWOPLAN_ID}"
          test "${EXPAND_PHASE}" = "awaiting-contract"
          grep -q "^run \`${EXPAND_RUN}\`: \*\*awaiting_contract\*\* (plan \`${TWOPLAN_ID}\`) at \[\`${HEAD_SHA:0:7}\`\](" "${EXPAND_SUMMARY}"
          grep -qF "expand applied; comment \`godwit confirm\` to run the contract phase" "${EXPAND_SUMMARY}"
          test "${CONTRACT_RUN}" = "${EXPAND_RUN}"
          test "${CONTRACT_PHASE}" = "contract"
          grep -q "^## godwit confirm$" "${CONTRACT_SUMMARY}"
          grep -q "^run \`${CONTRACT_RUN}\`: \*\*succeeded\*\* (plan \`${TWOPLAN_ID}\`) at \[\`${HEAD_SHA:0:7}\`\](" "${CONTRACT_SUMMARY}"
          test "${TWOVERIFY_PENDING}" = "0"
          grep -q '^## godwit verify$' "${TWOVERIFY_SUMMARY}"
          grep -q "^target \`two\`: 2 migrations, all applied$" "${TWOVERIFY_SUMMARY}"
          test "${NOTHING_OUTCOME}" = "failure"
          test -z "${NOTHING_RUN}"
          test -z "${NOTHING_PHASE}"
          grep -q "^no run of pull request #${PR_NUMBER} is awaiting its contract phase$" "${NOTHING_SUMMARY}"

          cat "${GH_STUB_LOG}"
          statuses="repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA} -f state="
          grep -c "^api --method POST ${statuses}pending -f context=godwit/applied -f description=applying ${HEAD_SHA:0:7} from pull request #${PR_NUMBER} -f target_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/" "${GH_STUB_LOG}" | grep -qx 3
          grep -q "^api --method POST ${statuses}failure -f context=godwit/applied -f description=plan stale or missing: re-plan on the pull request, then godwit apply again -f target_url=https://github.com/${GITHUB_REPOSITORY}/pull/7#issuecomment-1$" "${GH_STUB_LOG}"
          grep -q "^api --method POST ${statuses}success -f context=godwit/applied -f description=applied by run ${APPLY_RUN:0:8}; merge when the review is done -f target_url=https://github.com/${GITHUB_REPOSITORY}/pull/7#issuecomment-1$" "${GH_STUB_LOG}"
          grep -q "^api --method POST ${statuses}failure -f context=godwit/applied -f description=reverted by run ${REVERT_RUN:0:8}; comment godwit apply to apply again -f target_url=" "${GH_STUB_LOG}"
          grep -q "^api --method POST ${statuses}pending -f context=godwit/applied -f description=expand applied; comment godwit confirm to run the contract phase -f target_url=https://github.com/${GITHUB_REPOSITORY}/pull/7#issuecomment-1$" "${GH_STUB_LOG}"
          grep -c "^api --method POST ${statuses}pending -f context=godwit/applied -f description=confirming the contract phase of ${HEAD_SHA:0:7} from pull request #${PR_NUMBER} -f target_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/" "${GH_STUB_LOG}" | grep -qx 2
          grep -q "^api --method POST ${statuses}success -f context=godwit/applied -f description=contract applied by run ${CONTRACT_RUN:0:8}; merge when the review is done -f target_url=https://github.com/${GITHUB_REPOSITORY}/pull/7#issuecomment-1$" "${GH_STUB_LOG}"
          runs="https://github.com/${GITHUB_REPOSITORY}/actions/runs/"
          comment="https://github.com/${GITHUB_REPOSITORY}/pull/7#issuecomment-1"
          grep -q "^api --method POST ${statuses}success -f context=godwit/plan -f description=offline plan; no target was consulted -f target_url=${comment}$" "${GH_STUB_LOG}"
          grep -q "^api --method POST ${statuses}failure -f context=godwit/plan -f description=plan refused; the report says why -f target_url=${runs}" "${GH_STUB_LOG}"
          grep -c "^api --method POST ${statuses}pending -f context=godwit/plan -f description=2 to apply, 1 hazard to acknowledge -f target_url=${comment}$" "${GH_STUB_LOG}" | grep -qx 2
          grep -q "^api --method POST ${statuses}success -f context=godwit/plan -f description=nothing to apply -f target_url=${runs}" "${GH_STUB_LOG}"
          grep -q "^api --method POST ${statuses}success -f context=godwit/plan -f description=2 to apply -f target_url=${comment}$" "${GH_STUB_LOG}"
          grep -q "^api --method POST ${statuses}failure -f context=godwit/applied -f description=mode apply-on-pr never applies outside the pull request" "${GH_STUB_LOG}"
          grep -c "^api --method POST ${statuses}[a-z]* -f context=godwit/plan " "${GH_STUB_LOG}" | grep -qx 6
          grep -c "^api --method POST ${statuses}[a-z]* -f context=godwit/applied " "${GH_STUB_LOG}" | grep -qx 11
          grep -c "^api --method POST repos/${GITHUB_REPOSITORY}/statuses/" "${GH_STUB_LOG}" | grep -qx 17
          absent "^api --method POST repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA} "

          grep -q "^api --paginate repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews$" "${GH_STUB_LOG}"
          grep -q "^api repos/${GITHUB_REPOSITORY}/collaborators/reviewer/permission --jq .permission$" "${GH_STUB_LOG}"
          absent "^api repos/${GITHUB_REPOSITORY}/collaborators/pr-author/permission"

          grep -c "^api --method POST repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments -F body=@" "${GH_STUB_LOG}" | grep -qx 13
          grep -c '^<!-- godwit:refused -->$' "${GH_STUB_LOG}" | grep -qx 1
          grep -A1 '^<!-- godwit:refused -->$' "${GH_STUB_LOG}" | grep -qx '## godwit migrate refused'
          grep -c '^<!-- godwit:diff -->$' "${GH_STUB_LOG}" | grep -qx 2
          grep -q '^<!-- godwit:plan -->$' "${GH_STUB_LOG}"
          grep -c '^<!-- godwit:migrate -->$' "${GH_STUB_LOG}" | grep -qx 6
          grep -A1 '^<!-- godwit:migrate -->$' "${GH_STUB_LOG}" | grep -c '^## godwit apply$' | grep -qx 3
          grep -A1 '^<!-- godwit:migrate -->$' "${GH_STUB_LOG}" | grep -c '^## godwit confirm$' | grep -qx 2
          grep -A1 '^<!-- godwit:migrate -->$' "${GH_STUB_LOG}" | grep -q '^## godwit revert$'
          grep -q "^api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls --jq" "${GH_STUB_LOG}"
          grep -q "^api --method POST repos/${GITHUB_REPOSITORY}/issues/7/comments -F body=@" "${GH_STUB_LOG}"
          grep -A3 '^<!-- godwit:verify -->$' "${GH_STUB_LOG}" | grep -q '2 of 2 migrations are not applied'
          grep -q "^api --paginate repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits --jq" "${GH_STUB_LOG}"
          absent '^<!-- godwit:dry-run -->$'
          absent '^<!-- godwit:lint -->$'
