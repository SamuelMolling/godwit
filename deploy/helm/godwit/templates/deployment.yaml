apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "godwit.fullname" . }}
  labels:
    {{- include "godwit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "godwit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "godwit.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "godwit.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: godwit
          image: {{ include "godwit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - serve
            - --listen=:{{ .Values.serve.port }}
            - --drift-interval={{ .Values.serve.driftInterval }}
            - --scratch-template={{ .Values.serve.scratch.template }}
            {{- with .Values.serve.limits }}
            - --store-max-conns={{ .storeMaxConns }}
            - --max-concurrent-runs={{ .maxConcurrentRuns }}
            - --run-timeout={{ .runTimeout }}
            - --max-request-bytes={{ int64 .maxRequestBytes }}
            - --max-migrations={{ .maxMigrations }}
            - --max-files={{ .maxFiles }}
            - --max-file-bytes={{ int64 .maxFileBytes }}
            - --max-concurrent-diffs={{ .maxConcurrentDiffs }}
            {{- end }}
            {{- if .Values.serve.skipValidation }}
            - --skip-validation
            {{- end }}
            {{- if .Values.serve.ui.enabled }}
            - --ui
            - --ui-scope={{ .Values.serve.ui.scope }}
            {{- if not .Values.serve.ui.auth }}
            - --ui-anonymous-scope={{ .Values.serve.ui.anonymousScope }}
            {{- end }}
            {{- range .Values.serve.ui.origins }}
            - --ui-origin={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.serve.githubApp.enabled }}
            - --github-webhook-addr=:{{ .Values.serve.githubApp.port }}
            {{- if .Values.existingSecret.githubPrivateKey }}
            - --github-private-key-file={{ .Values.serve.githubApp.privateKeyPath }}/private-key.pem
            {{- end }}
            - --github-webhook-max-age={{ .Values.serve.githubApp.maxAge }}
            - --github-webhook-max-bytes={{ int64 .Values.serve.githubApp.maxBytes }}
            - --github-allowed-associations={{ join "," .Values.serve.githubApp.allowedAssociations }}
            - --github-emoji-reaction={{ .Values.serve.githubApp.emojiReaction }}
            {{- end }}
            {{- range .Values.serve.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- if ne .Values.serve.keyProvider.name "env" }}
            {{- if not .Values.serve.keyProvider.key }}
            {{- fail "serve.keyProvider.key is required for gcpkms and vault-transit" }}
            {{- end }}
            - name: GODWIT_KEY_PROVIDER
              value: {{ .Values.serve.keyProvider.name | quote }}
            - name: GODWIT_KMS_KEY
              value: {{ .Values.serve.keyProvider.key | quote }}
            {{- with .Values.serve.keyProvider.endpoint }}
            - name: GODWIT_KMS_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serve.keyProvider.transitMount }}
            - name: GODWIT_VAULT_TRANSIT_MOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serve.keyProvider.vaultAddr }}
            - name: GODWIT_VAULT_TRANSIT_ADDR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serve.keyProvider.vaultK8sRole }}
            - name: GODWIT_VAULT_TRANSIT_K8S_ROLE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serve.keyProvider.vaultK8sMount }}
            - name: GODWIT_VAULT_TRANSIT_K8S_MOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serve.keyProvider.vaultK8sJwt }}
            - name: GODWIT_VAULT_TRANSIT_K8S_JWT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serve.keyProvider.vaultTokenSecret.name }}
            - name: GODWIT_VAULT_TRANSIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.serve.keyProvider.vaultTokenSecret.key }}
            {{- end }}
            {{- end }}
            {{- if and .Values.serve.githubApp.enabled .Values.serve.githubApp.apiUrl }}
            - name: GODWIT_GITHUB_API_URL
              value: {{ .Values.serve.githubApp.apiUrl | quote }}
            {{- end }}
            - name: GODWIT_LOG_FORMAT
              value: {{ .Values.serve.logFormat | quote }}
            - name: GODWIT_LOG_LEVEL
              value: {{ .Values.serve.logLevel | quote }}
            {{- with .Values.notifications }}
            {{- if .webhookUrl }}
            - name: GODWIT_WEBHOOK_URL
              value: {{ .webhookUrl | quote }}
            {{- end }}
            {{- if .publicUrl }}
            - name: GODWIT_PUBLIC_URL
              value: {{ .publicUrl | quote }}
            {{- end }}
            {{- if .slack.channel }}
            - name: GODWIT_SLACK_CHANNEL
              value: {{ .slack.channel | quote }}
            - name: GODWIT_SLACK_MODE
              value: {{ .slack.mode | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret.name }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.serve.port }}
              protocol: TCP
            {{- if .Values.serve.githubApp.enabled }}
            - name: webhook
              containerPort: {{ .Values.serve.githubApp.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if and .Values.serve.githubApp.enabled .Values.existingSecret.githubPrivateKey }}
            - name: github-app-key
              mountPath: {{ .Values.serve.githubApp.privateKeyPath }}
              readOnly: true
            {{- end }}
            - name: vault-token
              mountPath: /var/run/secrets/godwit/vault
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: vault-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: godwit
                  expirationSeconds: 3600
                  path: token
        {{- if and .Values.serve.githubApp.enabled .Values.existingSecret.githubPrivateKey }}
        - name: github-app-key
          secret:
            secretName: {{ .Values.existingSecret.name }}
            # Group-readable: the volume is owned by root:fsGroup and the container is not root.
            defaultMode: 0440
            items:
              - key: {{ .Values.existingSecret.githubPrivateKey }}
                path: private-key.pem
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if eq .Values.podAntiAffinity "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "godwit.selectorLabels" . | nindent 18 }}
      {{- else if eq .Values.podAntiAffinity "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "godwit.selectorLabels" . | nindent 20 }}
      {{- end }}
