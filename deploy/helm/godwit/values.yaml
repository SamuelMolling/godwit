# Default values for the godwit chart. Every key is documented inline;
# the ci/full-values.yaml file shows every optional block switched on.

# Two replicas is the minimum for lease hand-over: when the replica executing
# a run dies, the other one reclaims the lease and finishes from the journal.
replicaCount: 2

image:
  # Published from main by .github/workflows/publish.yml (linux/amd64 and linux/arm64).
  # Tags: `main` (moving), `sha-<short commit>` (immutable). Set both when mirroring to your registry.
  repository: ghcr.io/samuelmolling/godwit
  # Defaults to .Chart.AppVersion when empty; `main` moves, so pin `sha-<short commit>` for a fixed rollout.
  tag: main
  # `main` moves: Always re-resolves it on every pod start. Use IfNotPresent with an immutable tag.
  pullPolicy: Always
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Added to every object the chart renders, and to the pod template. Not to the
# Deployment's selector, which is immutable — setting this on a live release is safe.
commonLabels: {}

# Secret the service reads its credentials from. Create it before installing:
#   kubectl create secret generic godwit \
#     --from-literal=GODWIT_MASTER_KEY=$(openssl rand -hex 32) \
#     --from-literal=GODWIT_TOKENS=ci:pipeline:ci-token,ops:operator:ops-token,admin:admin:admin-token \
#     --from-literal=GODWIT_STORE_DSN=postgres://godwit:...@store/godwit_store \
#     --from-literal=GODWIT_SCRATCH_DSN=postgres://godwit_scratch:...@scratch/postgres
# The DSNs reach serve as environment variables and never as arguments, so they appear neither in
# the pod spec nor in the container's /proc/<pid>/cmdline.
# GODWIT_SCRATCH_DSN is only read when serve.scratch.enabled is true; see serve.scratch.
# Add a GODWIT_SLACK_TOKEN entry and set notifications.slack.channel to enable Slack.
# Add GODWIT_UI_USER and GODWIT_UI_PASSWORD entries and set serve.ui.basicAuth for a shared UI identity.
existingSecret:
  name: godwit
  keys:
    # Only `static` targets need a key: they are the only ones whose secret godwit stores.
    # Leave masterKey empty for a deployment whose targets all use the kubernetes or vault
    # credential provider, or when serve.keyProvider.name is gcpkms or vault-transit.
    masterKey: GODWIT_MASTER_KEY
    # Keys accepted for decryption only, comma-separated. Set it during an `env` key rotation:
    # the new key goes in masterKey, the old one here, and every replica reseals what it finds
    # at start-up. Drop it on the next roll. See docs/security.md#rotation.
    masterKeyPrevious: ""
    tokens: GODWIT_TOKENS
    storeDSN: GODWIT_STORE_DSN
    scratchDSN: GODWIT_SCRATCH_DSN
    slackToken: GODWIT_SLACK_TOKEN
    uiUser: GODWIT_UI_USER
    uiPassword: GODWIT_UI_PASSWORD

# Flags of `godwit serve`; nothing else is accepted by the binary.
serve:
  # --listen: the API, /metrics, /healthz and /readyz share this port.
  port: 8474
  # Where the key that seals `static` target DSNs lives (docs/security.md).
  #   env           reads existingSecret.keys.masterKey. A store dump plus that key is every
  #                 static DSN, which is why the two below exist.
  #   gcpkms        wraps a per-value data key with a Cloud KMS CryptoKey; `key` is the
  #                 projects/…/cryptoKeys/… resource name and the pod's service account needs
  #                 roles/cloudkms.cryptoKeyEncrypterDecrypter on it (Workload Identity via
  #                 serviceAccount.annotations). Rotating the KMS key needs nothing here.
  #   vault-transit wraps it with a Vault Transit key; `key` is the key name, `transitMount`
  #                 the mount, and the auth is the same vault: block below.
  keyProvider:
    name: env
    key: ""
    # Cloud KMS base URL; empty is https://cloudkms.googleapis.com.
    endpoint: ""
    # Vault Transit mount; empty is `transit`.
    transitMount: ""
  # --drift-interval: how often targets are fingerprinted for schema drift.
  driftInterval: 5m
  # --skip-validation: disable the scratch-database validation at run admission.
  skipValidation: false
  # Where validation and diff execute the SQL callers submit. A `read` token is enough to reach
  # that execution, so it belongs on a PostgreSQL that holds nothing:
  #   CREATE ROLE godwit_scratch LOGIN PASSWORD '...'
  #     CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION NOBYPASSRLS;
  # enabled: true wires GODWIT_SCRATCH_DSN from existingSecret.keys.scratchDSN,
  # and the pods refuse to start if that role is a superuser or owns the store database.
  # enabled: false leaves scratch databases on the store server under the store's own role —
  # submitted DDL then runs as the owner of the control plane, and every pod warns on start.
  scratch:
    enabled: false
    # --scratch-template: what scratch databases are cloned from. template0 carries no extension
    # anyone installed into template1; name a prepared template to give validation extensions.
    template: template0
  # GODWIT_LOG_FORMAT: json or text.
  logFormat: json
  # GODWIT_LOG_LEVEL: debug, info, warn or error.
  logLevel: info
  ui:
    # --ui: serve the operator web UI at /ui on the same port.
    enabled: false
    # Wire GODWIT_UI_USER / GODWIT_UI_PASSWORD from existingSecret to add a shared /ui identity.
    # /ui already asks for basic auth whenever GODWIT_TOKENS is set: any token secret is a valid
    # password and signs in as that token, with its scope. Without tokens and without this pair
    # the UI is open to anyone who reaches the port and the service logs a warning.
    basicAuth: false
    # --ui-scope: what the shared identity may do — read, pipeline, operator or admin.
    # An anonymous visitor on a UI with no tokens and no basicAuth is always read, whatever this says.
    scope: operator
    # --ui-origin: the scheme://host[:port] origins a browser reaches /ui at, e.g.
    # ["https://godwit.example.com"]. Set this whenever an Ingress publishes /ui: it is the
    # allowlist of hosts the UI answers on and of origins a form post may come from. Empty
    # compares the browser's Origin with the request Host, which needs the proxy to preserve it.
    origins: []
  # Admission limits. Every request above one of them is refused with invalid_argument naming it.
  limits:
    # --store-max-conns: pool size against the store; wins over pool_max_conns in the DSN.
    storeMaxConns: 20
    # --max-concurrent-runs: runs this replica executes at once, each on its own goroutine.
    maxConcurrentRuns: 4
    # --run-timeout: wall clock one run may take before it is cancelled and finished as failed.
    runTimeout: 24h
    # --max-request-bytes: largest request body the API decodes (32 MiB).
    maxRequestBytes: 33554432
    # --max-migrations: migrations one request may carry; every one of them is two files.
    maxMigrations: 2000
    # --max-files: migration files one request may carry, migration halves and everything else alike.
    maxFiles: 5000
    # --max-file-bytes: largest single migration body, and the largest desired schema Diff accepts (4 MiB).
    maxFileBytes: 4194304
    # --max-concurrent-diffs: Diff, PlanRun, CreateRun, RevertRun and Checkpoint calls admitted at once;
    # each builds scratch databases, so size the scratch server's max_connections and disk for it.
    maxConcurrentDiffs: 4
  # Appended verbatim after the flags above. A flag repeated here wins over the flags above and over
  # the GODWIT_* environment variables, which are only defaults; --store-dsn and --scratch-dsn belong
  # in existingSecret rather than here, because an argument is readable from the pod spec.
  extraArgs: []

# Vault credential provider (targets registered with --provider vault).
# With addr set and no token the service uses the Kubernetes auth method,
# which needs the ServiceAccount token mounted (automountServiceAccountToken).
vault:
  addr: ""
  # VAULT_K8S_ROLE / VAULT_K8S_MOUNT for the Kubernetes auth method.
  k8sRole: ""
  k8sMount: ""
  # Static VAULT_TOKEN read from a Secret; leave name empty to use Kubernetes auth.
  tokenSecret:
    name: ""
    key: VAULT_TOKEN

notifications:
  # GODWIT_WEBHOOK_URL: run and drift events are POSTed here as JSON.
  webhookUrl: ""
  # GODWIT_PUBLIC_URL: base of the UI links in notifications, e.g. https://godwit.example.com.
  publicUrl: ""
  slack:
    # GODWIT_SLACK_CHANNEL: setting it wires GODWIT_SLACK_TOKEN from existingSecret.keys.slackToken.
    channel: ""
    # GODWIT_SLACK_MODE: thread (root message plus threaded replies) or edit (one message rewritten).
    mode: thread

# Extra environment for anything not modelled above (proxies).
extraEnv: []
# - name: HTTPS_PROXY
#   value: http://proxy:3128
extraEnvFrom: []
# - secretRef:
#     name: godwit-extra

# Extra volumes, e.g. for targets registered with --provider kubernetes
# (--secret-path points at a file mounted here).
extraVolumes: []
extraVolumeMounts: []

# Sidecars and init containers, verbatim. A credential-agent sidecar (Vault Agent,
# a cloud SQL proxy) belongs here; pair it with extraVolumes/extraVolumeMounts.
initContainers: []
extraContainers: []

# Raw manifests rendered alongside the release, each templated with the release
# context: `{{ include "godwit.fullname" . }}` and `.Release.Namespace` resolve.
# This is where objects the chart deliberately does not model go — the Secret
# itself (an ExternalSecret, a SealedSecret, a VaultStaticSecret), a NetworkPolicy,
# a PrometheusRule, a gateway-specific listener or traffic policy. Entries may be
# maps or strings; a string keeps `{{ }}` you want evaluated readable.
extraObjects: []
# - apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata:
#     name: godwit
#   spec:
#     secretStoreRef: { name: vault, kind: ClusterSecretStore }
#     target: { name: godwit }
#     dataFrom:
#       - extract: { key: secrets/godwit }

serviceAccount:
  create: true
  name: ""
  # Vault Kubernetes auth and cloud workload identity both hang off annotations, e.g.
  #   iam.gke.io/gcp-service-account: godwit@project.iam.gserviceaccount.com
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/godwit
  annotations: {}
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8474
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: godwit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: godwit-tls
  #   hosts: [godwit.example.com]

# Gateway API route, for a cluster that routes with Gateway API instead of Ingress.
# It is the upstream kind, so it works with any conformant implementation (Envoy
# Gateway, kgateway, Istio, Traefik, NGINX Gateway Fabric); nothing here names one.
# The Gateway itself, its listeners and any implementation-specific policy are the
# platform's, not the chart's — declare them in extraObjects or outside the release.
httpRoute:
  enabled: false
  # gateway.networking.k8s.io/v1 since Gateway API 1.0; v1beta1 for older CRDs.
  apiVersion: gateway.networking.k8s.io/v1
  annotations: {}
  labels: {}
  # Required when enabled: the Gateway (or ListenerSet) this route attaches to.
  parentRefs: []
  # - name: internal
  #   namespace: gateway-system
  #   sectionName: https
  hostnames: []
  # - godwit.example.com
  # Verbatim HTTPRoute rules. A rule with no backendRefs gets the godwit Service,
  # so the common case is matches only. Empty renders one PathPrefix / rule.
  rules: []
  # - matches:
  #     - path: { type: PathPrefix, value: /ui }
  #   filters: []

# Prometheus Operator scrape of /metrics (needs the ServiceMonitor CRD).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  failureThreshold: 3

# The API server shuts down gracefully; the scheduler lease of an in-flight run
# expires after this and another replica resumes it from the journal.
terminationGracePeriodSeconds: 30

priorityClassName: ""
revisionHistoryLimit: 10
# Rolling update knobs. maxUnavailable: 0 keeps every replica that holds a run
# lease alive until its replacement is ready.
updateStrategy: {}
# type: RollingUpdate
# rollingUpdate:
#   maxUnavailable: 0
#   maxSurge: 1

nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
# Keep replicas on different nodes so a node loss does not stop the scheduler:
# "soft" (preferred), "hard" (required) or "" to disable. Ignored when affinity is set.
podAntiAffinity: soft
affinity: {}

# Declarative target registration. Each entry of `list` becomes one `godwit target
# add` in a Job: the entries before the last run as init containers, in order, so a
# failure names the target that failed. The image is distroless, so there is no
# shell to loop in — this is what one-target-per-invocation looks like in a pod.
#
# RegisterTarget is an upsert that replaces the whole config map rather than
# patching it (docs/deployment.md#re-registering-replaces-the-whole-row). That is
# what makes re-running the Job on every upgrade safe *and* what makes this list
# authoritative: a setting someone added by hand with `godwit target add` is gone
# on the next sync unless it is written here too. Registering the same target from
# both this list and another job is the way to lose settings.
#
# The Job needs an `admin` token — the only scope RegisterTarget accepts. Keep it
# in a Secret of its own rather than reusing an entry of GODWIT_TOKENS the humans
# also hold.
targets:
  enabled: false
  list: []
  # - name: orders
  #   provider: vault
  #   vaultPath: secret/data/orders/db
  #   vaultTemplate: 'postgres://{{username}}:{{password}}@orders-db:5432/orders'
  #   lockTimeout: 5s
  #   statementTimeout: 15m
  #   requirePlan: true
  #   searchPath: app,public
  #   keepOld: true
  #   extraArgs: []
  # - name: billing
  #   provider: kubernetes
  #   secretPath: /secrets/billing/dsn
  # - name: legacy
  #   provider: static
  #   # dsn puts the credential in the pod spec; dsnSecret passes it as GODWIT_TARGET_DSN
  #   # from a Secret instead, never as an argument. Prefer dsnSecret.
  #   dsnSecret:
  #     name: legacy-dsn
  #     key: dsn
  tokenSecret:
    name: ""
    key: GODWIT_ADMIN_TOKEN
  # Where the Job reaches the API; empty is the release's own Service.
  server: ""
  # Run the Job as a Helm post-install/post-upgrade hook. Turn it off when the
  # deployment tool drives the Job itself — an ArgoCD release sets
  # `argocd.argoproj.io/hook: Sync` and `hook-delete-policy: BeforeHookCreation`
  # in annotations below, and a reconciled Job wants neither.
  helmHook: true
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  # The service may still be rolling out when the Job starts; retries cover that.
  backoffLimit: 6
  ttlSecondsAfterFinished: ""
  resources: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
