apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "godwit.fullname" . }}
  labels:
    {{- include "godwit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "godwit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "godwit.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "godwit.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: godwit
          image: {{ include "godwit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - serve
            - --listen=:{{ .Values.serve.port }}
            - --store-dsn=$(GODWIT_STORE_DSN)
            - --drift-interval={{ .Values.serve.driftInterval }}
            {{- if .Values.serve.scratch.enabled }}
            - --scratch-dsn=$(GODWIT_SCRATCH_DSN)
            {{- end }}
            - --scratch-template={{ .Values.serve.scratch.template }}
            {{- with .Values.serve.limits }}
            - --store-max-conns={{ .storeMaxConns }}
            - --max-concurrent-runs={{ .maxConcurrentRuns }}
            - --run-timeout={{ .runTimeout }}
            - --max-request-bytes={{ int64 .maxRequestBytes }}
            - --max-migrations={{ .maxMigrations }}
            - --max-files={{ .maxFiles }}
            - --max-file-bytes={{ int64 .maxFileBytes }}
            - --max-concurrent-diffs={{ .maxConcurrentDiffs }}
            {{- end }}
            {{- if .Values.serve.skipValidation }}
            - --skip-validation
            {{- end }}
            {{- if .Values.serve.ui.enabled }}
            - --ui
            - --ui-scope={{ .Values.serve.ui.scope }}
            {{- range .Values.serve.ui.origins }}
            - --ui-origin={{ . }}
            {{- end }}
            {{- end }}
            {{- range .Values.serve.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- if eq .Values.serve.keyProvider.name "env" }}
            {{- with .Values.existingSecret.keys.masterKey }}
            - name: GODWIT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret.name }}
                  key: {{ . }}
            {{- end }}
            {{- with .Values.existingSecret.keys.masterKeyPrevious }}
            - name: GODWIT_MASTER_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret.name }}
                  key: {{ . }}
            {{- end }}
            {{- else }}
            {{- if not .Values.serve.keyProvider.key }}
            {{- fail "serve.keyProvider.key is required for gcpkms and vault-transit" }}
            {{- end }}
            - name: GODWIT_KEY_PROVIDER
              value: {{ .Values.serve.keyProvider.name | quote }}
            - name: GODWIT_KMS_KEY
              value: {{ .Values.serve.keyProvider.key | quote }}
            {{- with .Values.serve.keyProvider.endpoint }}
            - name: GODWIT_KMS_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serve.keyProvider.transitMount }}
            - name: GODWIT_VAULT_TRANSIT_MOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: GODWIT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.tokens }}
            - name: GODWIT_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.storeDSN }}
            {{- if .Values.serve.scratch.enabled }}
            - name: GODWIT_SCRATCH_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.scratchDSN }}
            {{- end }}
            - name: GODWIT_LOG_FORMAT
              value: {{ .Values.serve.logFormat | quote }}
            - name: GODWIT_LOG_LEVEL
              value: {{ .Values.serve.logLevel | quote }}
            {{- if and .Values.serve.ui.enabled .Values.serve.ui.basicAuth }}
            - name: GODWIT_UI_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.uiUser }}
            - name: GODWIT_UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.uiPassword }}
            {{- end }}
            {{- with .Values.vault }}
            {{- if .addr }}
            - name: VAULT_ADDR
              value: {{ .addr | quote }}
            {{- end }}
            {{- if .k8sRole }}
            - name: VAULT_K8S_ROLE
              value: {{ .k8sRole | quote }}
            {{- end }}
            {{- if .k8sMount }}
            - name: VAULT_K8S_MOUNT
              value: {{ .k8sMount | quote }}
            {{- end }}
            {{- if .tokenSecret.name }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret.name }}
                  key: {{ .tokenSecret.key }}
            {{- end }}
            {{- end }}
            {{- with .Values.notifications }}
            {{- if .webhookUrl }}
            - name: GODWIT_WEBHOOK_URL
              value: {{ .webhookUrl | quote }}
            {{- end }}
            {{- if .publicUrl }}
            - name: GODWIT_PUBLIC_URL
              value: {{ .publicUrl | quote }}
            {{- end }}
            {{- if .slack.channel }}
            - name: GODWIT_SLACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret.name }}
                  key: {{ $.Values.existingSecret.keys.slackToken }}
            - name: GODWIT_SLACK_CHANNEL
              value: {{ .slack.channel | quote }}
            - name: GODWIT_SLACK_MODE
              value: {{ .slack.mode | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.serve.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if eq .Values.podAntiAffinity "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "godwit.selectorLabels" . | nindent 18 }}
      {{- else if eq .Values.podAntiAffinity "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "godwit.selectorLabels" . | nindent 20 }}
      {{- end }}
