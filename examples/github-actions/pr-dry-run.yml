# Non-persisting variant of the plan step in pr-plan-and-apply.yml: the same admitted plan, but
# nothing is stored, so the apply runs an implicit plan (or is refused when the target has
# require_plan). dry-run is allowed in both modes.
name: migrations dry run

on:
  pull_request:
    paths:
      - db/migrations/**   # your migration directory
      - godwit.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask the service for the admitted plan against the live target, without storing it
        uses: SamuelMolling/godwit@f4d803c9aae750b85ee35c75cabb990ea98d2eb6
        with:
          command: migrate
          dry-run: "true"
          dir: db/migrations                        # drop when godwit.yaml sets dir
          server: https://godwit.internal           # your godwit service URL
          token: ${{ secrets.GODWIT_TOKEN_READ }}   # token with the read scope
          target: orders                            # target registered on the service
          rollout: expand-contract                  # shows which statements wait for contract
