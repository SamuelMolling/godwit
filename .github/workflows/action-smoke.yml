name: action-smoke

on:
  pull_request:
    paths:
      - action.yml
      - scripts/action-context.sh
      - scripts/action-run.sh
      - scripts/action-comment.sh
      - scripts/action-refuse.sh
      - scripts/action-status.sh
      - internal/cli/**
      - internal/comment/**
      - testdata/action/**
      - .github/workflows/action-smoke.yml

permissions:
  contents: read

env:
  GODWIT_SERVER: http://127.0.0.1:8474

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: godwit
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: godwit
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U godwit" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Stub gh
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          stub="${RUNNER_TEMP}/stub-bin"
          mkdir -p "${stub}"
          cat >"${stub}/gh" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >>"${GH_STUB_LOG}"
          case "$*" in
            *"/reviews"*) printf '%s\n' "${GH_STUB_REVIEWS:-[]}" ;;
            *"/collaborators/rev/"*) printf '%s\n' "${GH_STUB_APPROVER_PERMISSION:-write}" ;;
            *"/collaborators/"*) printf '%s\n' "${GH_STUB_PERMISSION:-write}" ;;
            *"/pulls --jq"*) printf '%s\n' "${GH_STUB_PULLS:-}" ;;
            *"/commits --jq"*) printf '%s\n' "${GH_STUB_COMMITS:-}" ;;
            *"/pulls/"*) printf '%s\n' "${GH_STUB_PR:-}" ;;
            *"--method "*)
              for arg in "$@"; do
                case "${arg}" in body=@*) cat "${arg#body=@}" >>"${GH_STUB_LOG}" ;; esac
              done
              case "$*" in *"/comments"*) printf '%s\n' "${GH_STUB_COMMENT_URL:-}" ;; esac
              ;;
            *"/comments"*) printf '%s\n' "${GH_STUB_COMMENT_IDS:-}" ;;
          esac
          EOF
          chmod +x "${stub}/gh"
          echo "${stub}" >>"${GITHUB_PATH}"
          {
            echo "GH_STUB_LOG=${RUNNER_TEMP}/gh-stub.log"
            echo "GH_STUB_PR={\"head\":{\"sha\":\"${HEAD_SHA}\"},\"state\":\"open\",\"merged\":false,\"user\":{\"login\":\"pr-author\"}}"
            echo "GH_STUB_REVIEWS=[{\"state\":\"APPROVED\",\"commit_id\":\"${HEAD_SHA}\",\"user\":{\"login\":\"reviewer\"}}]"
            echo "GH_STUB_PERMISSION=write"
            echo "GH_STUB_COMMITS=${HEAD_SHA}"
            echo "GH_STUB_COMMENT_URL=https://github.com/${GITHUB_REPOSITORY}/pull/7#issuecomment-1"
          } >>"${GITHUB_ENV}"

      - name: lint without acknowledging H001
        id: blocking
        continue-on-error: true
        uses: ./
        with:
          command: lint
          dir: testdata/action/migrations
          base: ""
          comment: "false"

      - name: lint with H001 acknowledged
        id: lint
        uses: ./
        with:
          command: lint
          dir: testdata/action/migrations
          base: ""
          ack: H001
          comment: "false"

      - name: lint scoped to migrations added since origin/main
        uses: ./
        with:
          command: lint
          dir: testdata/action/migrations
          ack: H001
          comment: "false"

      - name: plan offline
        id: plan
        uses: ./
        with:
          command: plan
          dir: testdata/action/migrations

      - name: migrate is refused in mode apply-on-pr
        id: gate
        continue-on-error: true
        uses: ./
        with:
          command: migrate
          dir: testdata/action/migrations
          target: app
          token: smoke-pipe
          ack: H001

      - name: Start the service and register a target
        shell: bash
        env:
          GODWIT_TOKENS: ci-read:read:smoke-read,ci-pipe:pipeline:smoke-pipe,ops:admin:smoke-admin
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          GODWIT_MASTER_KEY="$(openssl rand -hex 32)"
          export GODWIT_MASTER_KEY
          docker exec "${POSTGRES_ID}" psql -U godwit -c 'CREATE DATABASE app'
          nohup "${RUNNER_TEMP}/godwit" serve --listen 127.0.0.1:8474 --tick-interval 500ms \
            --store-dsn 'postgres://godwit@127.0.0.1:5432/godwit?sslmode=disable' >"${RUNNER_TEMP}/serve.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fs "${GODWIT_SERVER}/readyz" >/dev/null; then break; fi
            sleep 1
          done
          curl -fs "${GODWIT_SERVER}/readyz"
          # The server's own role is named godwit, so without a path of its own the target would
          # resolve "$user" to the journal schema.
          "${RUNNER_TEMP}/godwit" target add app --token smoke-admin --provider static --search-path public \
            --dsn 'postgres://godwit@127.0.0.1:5432/app?sslmode=disable'
          mkdir -p "${RUNNER_TEMP}/diff"

      - name: diff dry run against the empty target
        id: diffdry
        uses: ./
        with:
          command: diff
          target: app
          token: smoke-read
          schema: testdata/action/schema.sql
          dry-run: "true"

      - name: plan without acknowledging H001
        id: unacked
        continue-on-error: true
        uses: ./
        with:
          command: plan
          dir: testdata/action/migrations
          target: app
          token: smoke-read
          comment: "false"

      - name: plan on the service
        id: stored
        uses: ./
        with:
          command: plan
          dir: testdata/action/migrations
          target: app
          token: smoke-read
          ack: H001

      - name: Change the target by hand
        shell: bash
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: docker exec "${POSTGRES_ID}" psql -U godwit -d app -c 'CREATE TABLE public.rogue (id int)'

      - name: apply against a stale plan
        id: stale
        continue-on-error: true
        uses: ./
        with:
          command: apply
          dir: testdata/action/migrations
          target: app
          token: smoke-pipe
          ack: H001

      - name: re-plan on the service
        id: replan
        uses: ./
        with:
          command: plan
          dir: testdata/action/migrations
          target: app
          token: smoke-read
          ack: H001

      - name: apply bound to the stored plan
        id: apply
        uses: ./
        with:
          command: apply
          dir: testdata/action/migrations
          target: app
          token: smoke-pipe
          ack: H001

      - name: verify finds everything applied
        id: verified
        uses: ./
        with:
          command: verify
          dir: testdata/action/migrations
          target: app
          token: smoke-read
          ack: H001

      - name: dry run on the target that has everything
        id: dryrun
        uses: ./
        with:
          command: migrate
          dir: testdata/action/migrations
          target: app
          token: smoke-pipe
          dry-run: "true"
          comment: "false"

      - name: revert the run of the pull request
        id: revert
        uses: ./
        with:
          command: revert
          target: app
          token: smoke-pipe
          ack: H001,H002,H009

      - name: diff writes the migration after the revert
        id: diff
        uses: ./
        with:
          command: diff
          dir: ${{ runner.temp }}/diff
          target: app
          token: smoke-read
          schema: testdata/action/schema.sql
          name: users_from_schema

      - name: Register a second target for the two-phase flow
        shell: bash
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "${POSTGRES_ID}" psql -U godwit -c 'CREATE DATABASE two'
          "${RUNNER_TEMP}/godwit" target add two --token smoke-admin --provider static --search-path public \
            --dsn 'postgres://godwit@127.0.0.1:5432/two?sslmode=disable'

      - name: plan the migration carrying a directive
        id: twoplan
        uses: ./
        with:
          command: plan
          dir: testdata/action/two-phase
          target: two
          token: smoke-read
          rollout: expand-contract

      - name: apply runs the expand phase and holds the contract one
        id: expand
        uses: ./
        with:
          command: apply
          dir: testdata/action/two-phase
          target: two
          token: smoke-pipe
          rollout: expand-contract

      - name: the column is not swapped while the run awaits the contract phase
        shell: bash
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          columns() {
            docker exec "${POSTGRES_ID}" psql -U godwit -d two -tAc \
              "SELECT attname || ' ' || format_type(atttypid, atttypmod) FROM pg_attribute
               WHERE attrelid = 'public.people'::regclass AND attnum > 0 AND NOT attisdropped ORDER BY attnum"
          }
          columns | grep -qx 'age integer'
          columns | grep -qx 'age_new bigint'

      - name: confirm runs the contract phase from the pull request
        id: contract
        uses: ./
        with:
          command: confirm
          target: two
          token: smoke-pipe

      - name: the contract phase swapped the column and kept the old one
        shell: bash
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          columns() {
            docker exec "${POSTGRES_ID}" psql -U godwit -d two -tAc \
              "SELECT attname || ' ' || format_type(atttypid, atttypmod) FROM pg_attribute
               WHERE attrelid = 'public.people'::regclass AND attnum > 0 AND NOT attisdropped ORDER BY attnum"
          }
          columns | grep -qx 'age bigint'
          columns | grep -qx 'age_old integer'
          docker exec "${POSTGRES_ID}" psql -U godwit -d two -tAc \
            'SELECT count(*) FROM public.people WHERE age <> age_old' | grep -qx 0

      - name: verify passes on the target that applied the change-type
        id: twoverify
        uses: ./
        with:
          command: verify
          dir: testdata/action/two-phase
          target: two
          token: smoke-read

      - name: confirm with nothing awaiting the contract phase fails
        id: nothing
        continue-on-error: true
        uses: ./
        with:
          command: confirm
          target: two
          token: smoke-pipe

      - name: verify on push after the revert
        id: pending
        shell: bash
        env:
          GODWIT_BIN: ${{ runner.temp }}/godwit
          GH_TOKEN: stub
          GH_STUB_PULLS: "7"
          EVENT_NAME: push
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ""
          SKIPPED: "false"
          COMMAND: verify
          DIR: testdata/action/migrations
          BASE: ""
          ACK: H001
          SERVER: ""
          TARGET: app
          ROLLOUT: ""
          DRY_RUN: "false"
          SOURCE: ""
          GODWIT_TOKEN: smoke-read
          COMMENT: "true"
          COMMENT_ON_PUSH: "true"
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ./scripts/action-run.sh
          STATUS="$(sed -n 's/^status=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          STALE="$(sed -n 's/^stale=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          RUN_ID="$(sed -n 's/^run-id=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          SUMMARY="$(sed -n 's/^summary-path=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          export STATUS STALE RUN_ID SUMMARY
          ./scripts/action-comment.sh

      - name: Read comment, review and pull request events
        shell: bash
        env:
          GODWIT_BIN: ${{ runner.temp }}/godwit
          GH_TOKEN: stub
          GH_STUB_LOG: ${{ runner.temp }}/context-gh.log
          MODE: apply-on-pr
          DRY_RUN: "false"
          ALLOWED_ASSOCIATIONS: OWNER,MEMBER,COLLABORATOR
          REQUIRE_APPROVAL: "false"
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OTHER_SHA: "1111111111111111111111111111111111111111"
        run: |
          set -euo pipefail
          export EVENT_PATH="${RUNNER_TEMP}/event.json"
          out="${RUNNER_TEMP}/context.out"
          log="${RUNNER_TEMP}/context.log"
          export GITHUB_OUTPUT="${out}"
          context() {
            : >"${out}"
            : >"${GH_STUB_LOG}"
            local rc=0
            ./scripts/action-context.sh >"${log}" 2>&1 || rc=$?
            cat "${log}"
            cat "${GH_STUB_LOG}"
            printf 'rc=%s\n' "${rc}" >>"${out}"
          }
          expect() { grep -qx "$1" "${out}"; }
          absent() { if grep -q "$1" "${out}"; then exit 1; fi; }
          says() { grep -qF "$1" "${log}"; }
          answered() {
            grep -qF "api --method POST repos/${GITHUB_REPOSITORY}/issues/7/comments -F body=@" "${GH_STUB_LOG}"
            grep -qxF '<!-- godwit:refused -->' "${GH_STUB_LOG}"
            grep -qF "$1" "${GH_STUB_LOG}"
            if [ -n "${2:-}" ]; then
              grep -qF "statuses/${3:-${HEAD_SHA}} -f state=failure -f context=$2 -f description=" "${GH_STUB_LOG}"
            elif grep -q '/statuses/' "${GH_STUB_LOG}"; then
              exit 1
            fi
          }
          mute() { if grep -q -- '--method POST' "${GH_STUB_LOG}"; then exit 1; fi; }
          comment() {
            printf '{"action":"%s","issue":{"number":7%s},"comment":{"body":"%s","author_association":"%s","user":{"login":"dev"}}}' \
              "$1" "$2" "$3" "$4" >"${EVENT_PATH}"
          }
          review() {
            printf '{"action":"submitted","review":{"state":"%s","body":"%s","author_association":"%s","commit_id":"%s","user":{"login":"rev"}},"pull_request":{"number":7}}' \
              "$1" "$2" "$3" "${4:-${HEAD_SHA}}" >"${EVENT_PATH}"
          }
          pull() {
            printf '{"pull_request":{"number":7,"head":{"sha":"%s","repo":{"full_name":"%s"}}}}' \
              "${1:-${HEAD_SHA}}" "${2-${GITHUB_REPOSITORY}}" >"${EVENT_PATH}"
          }
          approval() {
            printf '[{"state":"%s","commit_id":"%s","user":{"login":"%s"}}]' "$1" "$2" "$3"
          }

          export EVENT_NAME=issue_comment COMMAND=apply APPLY_ON=comment
          comment created ',"pull_request":{"url":"x"}' 'godwit apply' MEMBER
          context; expect rc=0; expect skipped=false; expect pr-number=7; expect "head-sha=${HEAD_SHA}"
          comment created ',"pull_request":{"url":"x"}' '/godwit apply' MEMBER
          context; expect rc=0; expect skipped=false; expect pr-number=7; expect "head-sha=${HEAD_SHA}"
          comment created ',"pull_request":{"url":"x"}' '/godwit apply --ack H001' MEMBER
          context; expect rc=0; expect skipped=false; expect ack=H001
          comment created ',"pull_request":{"url":"x"}' 'godwitapply' MEMBER
          context; expect rc=0; expect skipped=true; mute
          comment created ',"pull_request":{"url":"x"}' '  godwit apply\r\n' OWNER
          context; expect rc=0; expect skipped=false
          comment created ',"pull_request":{"url":"x"}' 'godwit apply' CONTRIBUTOR
          context; expect rc=1; absent '^skipped='; answered 'author association CONTRIBUTOR is not in' godwit/applied
          comment created ',"pull_request":{"url":"x"}' 'looks good' OWNER
          context; expect rc=0; expect skipped=true; mute
          comment created ',"pull_request":{"url":"x"}' 'please godwit apply' OWNER
          context; expect rc=0; expect skipped=true; mute
          comment created '' 'godwit apply' OWNER
          context; expect rc=0; expect skipped=true; mute
          comment edited ',"pull_request":{"url":"x"}' 'godwit apply' OWNER
          context; expect rc=0; expect skipped=true; mute
          APPLY_ON=approve comment created ',"pull_request":{"url":"x"}' 'godwit apply' OWNER
          APPLY_ON=approve context; expect rc=0; expect skipped=true
          COMMAND=revert comment created ',"pull_request":{"url":"x"}' 'godwit revert' COLLABORATOR
          COMMAND=revert context; expect rc=0; expect skipped=false; expect pr-number=7
          COMMAND=revert comment created ',"pull_request":{"url":"x"}' 'godwit apply' COLLABORATOR
          COMMAND=revert context; expect rc=0; expect skipped=true
          COMMAND=confirm comment created ',"pull_request":{"url":"x"}' 'godwit confirm' MEMBER
          COMMAND=confirm context; expect rc=0; expect skipped=false; expect pr-number=7
          COMMAND=confirm comment created ',"pull_request":{"url":"x"}' 'godwit confirm' CONTRIBUTOR
          COMMAND=confirm context; expect rc=1; absent '^skipped='
          COMMAND=confirm comment created ',"pull_request":{"url":"x"}' 'godwit apply' OWNER
          COMMAND=confirm context; expect rc=0; expect skipped=true

          comment created ',"pull_request":{"url":"x"}' "godwit apply ${HEAD_SHA}" OWNER
          context; expect rc=0; expect skipped=false
          comment created ',"pull_request":{"url":"x"}' "godwit apply ${HEAD_SHA:0:8}" OWNER
          context; expect rc=0; expect skipped=false
          comment created ',"pull_request":{"url":"x"}' "godwit apply ${OTHER_SHA}" OWNER
          context; expect rc=1; says 'the head moved after the comment'
          answered 'the head moved after the comment' godwit/applied
          comment created ',"pull_request":{"url":"x"}' 'godwit apply notasha' OWNER
          context; expect rc=2; says "does not understand 'notasha'"
          answered "does not understand 'notasha'" godwit/applied

          comment created ',"pull_request":{"url":"x"}' 'godwit apply --ack H001' OWNER
          context; expect rc=0; expect skipped=false; expect ack=H001
          ACK=H002 context; expect rc=0; expect ack=H002,H001
          comment created ',"pull_request":{"url":"x"}' 'godwit apply --ack H001,H003' OWNER
          context; expect rc=0; expect ack=H001,H003
          comment created ',"pull_request":{"url":"x"}' 'godwit apply --ack=H001' OWNER
          context; expect rc=0; expect ack=H001
          comment created ',"pull_request":{"url":"x"}' "godwit apply ${HEAD_SHA} --ack H001" OWNER
          context; expect rc=0; expect skipped=false; expect ack=H001
          comment created ',"pull_request":{"url":"x"}' "godwit apply ${OTHER_SHA} --ack H001" OWNER
          context; expect rc=1; says 'the head moved after the comment'
          comment created ',"pull_request":{"url":"x"}' 'godwit apply --ack' OWNER
          context; expect rc=2; says 'names no hazard code'
          comment created ',"pull_request":{"url":"x"}' 'godwit apply --ack h1' OWNER
          context; expect rc=2; says "'h1' is not a hazard code"
          comment created ',"pull_request":{"url":"x"}' 'godwit apply --ack H001 --force' OWNER
          context; expect rc=2; says 'does not take --force'
          comment created ',"pull_request":{"url":"x"}' 'godwit apply --unknown' OWNER
          context; expect rc=2; says "does not understand '--unknown'"
          answered "does not understand '--unknown'" godwit/applied
          COMMAND=confirm comment created ',"pull_request":{"url":"x"}' 'godwit confirm --ack H001' MEMBER
          COMMAND=confirm context; expect rc=2; says 'does not take --ack'
          COMMAND=revert comment created ',"pull_request":{"url":"x"}' 'godwit revert --ack H002 --allow-data-loss --force' OWNER
          COMMAND=revert context; expect rc=0; expect skipped=false; expect ack=H002; expect allow-data-loss=true; expect force=true
          COMMAND=revert comment created ',"pull_request":{"url":"x"}' 'godwit revert' OWNER
          COMMAND=revert context; expect rc=0; expect allow-data-loss=; expect force=

          comment created ',"pull_request":{"url":"x"}' "\`\`\`\ngodwit apply\n\`\`\`" OWNER
          context; expect rc=0; expect skipped=true
          comment created ',"pull_request":{"url":"x"}' '~~~\ngodwit apply\n~~~' OWNER
          context; expect rc=0; expect skipped=true
          comment created ',"pull_request":{"url":"x"}' "log:\n\`\`\`\ngodwit apply\n\`\`\`\ngodwit apply" OWNER
          context; expect rc=0; expect skipped=true
          comment created ',"pull_request":{"url":"x"}' 'To deploy, comment:\ngodwit apply' OWNER
          context; expect rc=0; expect skipped=true
          comment created ',"pull_request":{"url":"x"}' 'godwit apply\nthanks' OWNER
          context; expect rc=0; expect skipped=true
          comment created ',"pull_request":{"url":"x"}' 'godwit apply\n\nthanks' OWNER
          context; expect rc=0; expect skipped=true
          comment created ',"pull_request":{"url":"x"}' 'note:\ngodwit apply --unknown' OWNER
          context; expect rc=0; expect skipped=true; mute
          comment created ',"pull_request":{"url":"x"}' 'godwit apply\n\n' OWNER
          context; expect rc=0; expect skipped=false
          comment created ',"pull_request":{"url":"x"}' "\`godwit apply\`" OWNER
          context; expect rc=0; expect skipped=false
          comment created ',"pull_request":{"url":"x"}' "\`\`\`godwit apply --ack H001\`\`\`" OWNER
          context; expect rc=0; expect skipped=false; expect ack=H001

          comment created ',"pull_request":{"url":"x"}' 'godwit apply' MEMBER
          GH_STUB_PERMISSION="read" context; expect rc=1; says "has permission 'read'"
          answered "has permission 'read'" godwit/applied
          GH_STUB_PERMISSION="none" context; expect rc=1; says "has permission 'none'"
          GH_STUB_PERMISSION="admin" context; expect rc=0; expect skipped=false
          printf '{"action":"created","issue":{"number":7,"pull_request":{"url":"x"}},"comment":{"body":"godwit apply","author_association":"OWNER","user":{"login":"dev;id"}}}' >"${EVENT_PATH}"
          context; expect rc=1; says 'is not a GitHub login'
          answered 'is not a GitHub login' godwit/applied
          printf '{"action":"created","issue":{"number":"7x","pull_request":{"url":"x"}},"comment":{"body":"godwit apply","author_association":"OWNER","user":{"login":"dev"}}}' >"${EVENT_PATH}"
          context; expect rc=1; says 'carries no pull request number'
          mute; says 'names no pull request to answer on'

          comment created ',"pull_request":{"url":"x"}' 'godwit apply' OWNER
          ALLOWED_ASSOCIATIONS=OWNER,CONTRIBUTOR context; expect rc=2; says 'must not contain CONTRIBUTOR'
          answered 'must not contain CONTRIBUTOR' godwit/applied
          ALLOWED_ASSOCIATIONS=NONE context; expect rc=2
          ALLOWED_ASSOCIATIONS=owner context; expect rc=2; says 'unknown value'
          ALLOWED_ASSOCIATIONS='' context; expect rc=2; says 'allowed-associations is empty'
          answered 'allowed-associations is empty' godwit/applied
          REQUIRE_APPROVAL=maybe context; expect rc=2; says 'unknown require-approval'
          answered 'unknown require-approval' godwit/applied

          export REQUIRE_APPROVAL=true GH_STUB_REVIEWS='[]'
          comment created ',"pull_request":{"url":"x"}' 'godwit apply' OWNER
          context; expect rc=1; says 'no approving review'
          answered 'no approving review' godwit/applied
          GH_STUB_COMMENT_IDS=42 context; expect rc=1
          grep -qF "api --method DELETE repos/${GITHUB_REPOSITORY}/issues/comments/42" "${GH_STUB_LOG}"
          GH_STUB_REVIEWS="$(approval APPROVED "${HEAD_SHA}" rev)" context; expect rc=0; expect skipped=false
          GH_STUB_REVIEWS="$(approval APPROVED "${OTHER_SHA}" rev)" context; expect rc=1; says 'no approving review'
          GH_STUB_REVIEWS="$(approval APPROVED "${HEAD_SHA}" pr-author)" context; expect rc=1; says 'no approving review'
          GH_STUB_REVIEWS="[{\"state\":\"APPROVED\",\"commit_id\":\"${HEAD_SHA}\",\"user\":{\"login\":\"rev\"}},{\"state\":\"CHANGES_REQUESTED\",\"commit_id\":\"${HEAD_SHA}\",\"user\":{\"login\":\"rev\"}}]" \
            context; expect rc=1; says 'no approving review'
          GH_STUB_REVIEWS="[{\"state\":\"CHANGES_REQUESTED\",\"commit_id\":\"${HEAD_SHA}\",\"user\":{\"login\":\"rev\"}},{\"state\":\"APPROVED\",\"commit_id\":\"${HEAD_SHA}\",\"user\":{\"login\":\"rev\"}}]" \
            context; expect rc=0; expect skipped=false
          GH_STUB_REVIEWS="$(approval APPROVED "${HEAD_SHA}" rev)" GH_STUB_APPROVER_PERMISSION="read" context; expect rc=1; says 'approver rev'
          answered 'approver rev' godwit/applied
          COMMAND=confirm comment created ',"pull_request":{"url":"x"}' 'godwit confirm' OWNER
          COMMAND=confirm context; expect rc=1; says 'no approving review'
