# PostSync hook: the new pods are healthy, release the contract phase of the
# run the PreSync hook left in awaiting_contract. --allow-none keeps the hook
# green on syncs whose migrations held nothing back (or had none at all).
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-confirm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-confirm
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: godwit
          image: ghcr.io/samuelmolling/godwit:main
          args:
            - run
            - confirm
            - --latest
            - --allow-none
            - --target=orders
          env:
            - name: GODWIT_SERVER
              value: http://godwit.godwit.svc:8474
            - name: GODWIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orders-godwit
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
