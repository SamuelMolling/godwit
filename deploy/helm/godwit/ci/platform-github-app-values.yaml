# The GitHub App switched on: two listeners, two Services, two hostnames.
replicaCount: 2

image:
  tag: sha-1a2b3c4
  pullPolicy: IfNotPresent

existingSecret:
  name: godwit
  githubPrivateKey: github-private-key.pem

serve:
  ui:
    enabled: true
    origins: ["https://godwit.example.internal"]
  githubApp:
    enabled: true
    maxAge: 30m
    allowedAssociations: [OWNER, MEMBER]
    emojiReaction: rocket
    service:
      annotations:
        cloud.google.com/neg: '{"ingress": true}'

notifications:
  publicUrl: https://godwit.example.internal

httpRoute:
  enabled: true
  parentRefs:
    - name: internal
      namespace: gateway-system
      sectionName: https
  hostnames:
    - godwit.example.internal

serviceMonitor:
  enabled: true

# The webhook's route is not the API's: another hostname, another Gateway, the webhook Service.
extraObjects:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: {{ include "godwit.fullname" . }}-webhook
      labels:
        {{- include "godwit.labels" . | nindent 4 }}
    spec:
      parentRefs:
        - name: public
          namespace: gateway-system
          sectionName: https
      hostnames:
        - godwit-webhook.example.com
      rules:
        - matches:
            - path: { type: Exact, value: /github/webhook }
          backendRefs:
            - name: {{ include "godwit.fullname" . }}-webhook
              port: {{ .Values.serve.githubApp.service.port }}
  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: {{ include "godwit.fullname" . }}-webhook
      labels:
        {{- include "godwit.labels" . | nindent 4 }}
    spec:
      podSelector:
        matchLabels:
          {{- include "godwit.selectorLabels" . | nindent 6 }}
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: gateway-system
          ports:
            - port: {{ .Values.serve.githubApp.port }}
