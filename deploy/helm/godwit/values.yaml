# Two replicas is the minimum for lease hand-over: the survivor finishes the run from the journal.
replicaCount: 2

image:
  repository: ghcr.io/samuelmolling/godwit
  # Empty takes .Chart.AppVersion. `main` moves, hence pullPolicy Always; pin `sha-<commit>` instead.
  tag: main
  pullPolicy: Always
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Added to every rendered object and the pod template, never to the immutable Deployment selector.
commonLabels: {}

# Read whole: every entry becomes an environment variable of that name. Only GODWIT_STORE_DSN is required.
existingSecret:
  name: godwit
  # Empty takes the PEM from envFrom as GODWIT_GITHUB_PRIVATE_KEY; an entry name projects it as a file.
  githubPrivateKey: ""

serve:
  # --listen: the API, /metrics, /healthz and /readyz share this port.
  port: 8474
  # Where the key that seals `static` target DSNs lives: env, gcpkms or vault-transit (docs/security.md).
  keyProvider:
    name: env
    key: ""
    # Cloud KMS base URL; empty is https://cloudkms.googleapis.com.
    endpoint: ""
    # Vault Transit mount; empty is `transit`.
    transitMount: ""
    # vault-transit only, and its own Vault: no target is read through it.
    vaultAddr: ""
    vaultK8sRole: ""
    vaultK8sMount: ""
    vaultK8sJwt: ""
    vaultTokenSecret:
      name: ""
      key: GODWIT_VAULT_TRANSIT_TOKEN
  # --drift-interval: how often targets are fingerprinted for schema drift.
  driftInterval: 5m
  # --skip-validation: disable the scratch-database validation at run admission.
  skipValidation: false
  # Where validation and diff execute submitted SQL; without GODWIT_SCRATCH_DSN it stays on the store server.
  scratch:
    # --scratch-template: template0 carries no extension installed into template1; name a prepared one to.
    template: template0
  # GODWIT_LOG_FORMAT: json or text.
  logFormat: json
  # GODWIT_LOG_LEVEL: debug, info, warn or error.
  logLevel: info
  ui:
    # --ui: serve the operator web UI at /ui on the same port.
    enabled: false
    # --ui-scope: what a GODWIT_UI_USER / GODWIT_UI_PASSWORD identity may do; a token signs in as itself.
    scope: operator
    # false asks for no password at all: every visitor is ui:anonymous. Only behind a trusted boundary.
    auth: true
    # --ui-anonymous-scope: what an unauthenticated visitor may do when auth is false.
    anonymousScope: operator
    # --ui-origin: the origins a browser reaches /ui at; empty compares the Origin with the request Host.
    origins: []
  # Admission limits. Every request above one of them is refused with invalid_argument naming it.
  limits:
    # --store-max-conns: pool size against the store; wins over pool_max_conns in the DSN.
    storeMaxConns: 20
    # --max-concurrent-runs: runs this replica executes at once, each on its own goroutine.
    maxConcurrentRuns: 4
    # --run-timeout: wall clock one run may take before it is cancelled and finished as failed.
    runTimeout: 24h
    # --max-request-bytes: largest request body the API decodes (32 MiB).
    maxRequestBytes: 33554432
    # --max-migrations: migrations one request may carry; every one of them is two files.
    maxMigrations: 2000
    # --max-files: migration files one request may carry, migration halves and everything else alike.
    maxFiles: 5000
    # --max-file-bytes: largest single migration body, and the largest desired schema Diff accepts (4 MiB).
    maxFileBytes: 4194304
    # --max-concurrent-diffs: each builds scratch databases; size the scratch server for this number.
    maxConcurrentDiffs: 4
  # A listener of its own serving /github/webhook alone; off renders no port, Service or flag (README).
  githubApp:
    enabled: false
    # --github-webhook-addr: the port that listener binds.
    port: 8475
    # GODWIT_GITHUB_API_URL: empty is https://api.github.com; set it for GitHub Enterprise Server.
    apiUrl: ""
    # Where existingSecret.githubPrivateKey is mounted, as `<privateKeyPath>/private-key.pem`.
    privateKeyPath: /secrets/github
    # --github-webhook-max-age: how old the signed body's own timestamp may be before it is a replay.
    maxAge: 1h
    # --github-webhook-max-bytes: largest delivery body read before the signature is verified.
    maxBytes: 1048576
    # --github-allowed-associations: narrows, does not authorise; the commander also needs write access.
    allowedAssociations: [OWNER, MEMBER, COLLABORATOR]
    # --github-emoji-reaction: what godwit adds to a comment it read as a command; `none` adds none.
    emojiReaction: eyes
    # Its own Service, carrying this port alone, so a route pointed at it cannot reach the API.
    service:
      type: ClusterIP
      port: 8475
      annotations: {}
  # Appended verbatim, winning over the flags above. Not the DSNs: an argument is readable from the pod spec.
  extraArgs: []

notifications:
  # GODWIT_WEBHOOK_URL: run and drift events are POSTed here as JSON.
  webhookUrl: ""
  # GODWIT_PUBLIC_URL: base of the UI links in notifications, e.g. https://godwit.example.com.
  publicUrl: ""
  slack:
    # GODWIT_SLACK_CHANNEL: a GODWIT_SLACK_TOKEN with no channel is a start-up failure, not a no-op.
    channel: ""
    # GODWIT_SLACK_MODE: thread (root message plus threaded replies) or edit (one message rewritten).
    mode: thread

extraEnv: []
# - name: HTTPS_PROXY
#   value: http://proxy:3128
extraEnvFrom: []
# - secretRef:
#     name: godwit-extra

# For a target registered with --provider kubernetes, whose --secret-path points at a file here.
extraVolumes: []
extraVolumeMounts: []

# Verbatim. A credential-agent sidecar (Vault Agent, a cloud SQL proxy) belongs here.
initContainers: []
extraContainers: []

# Raw manifests templated with the release context: the Secret, a NetworkPolicy, a PrometheusRule.
extraObjects: []
# - apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata:
#     name: godwit
#   spec:
#     secretStoreRef: { name: vault, kind: ClusterSecretStore }
#     target: { name: godwit }
#     dataFrom:
#       - extract: { key: secrets/godwit }

serviceAccount:
  create: true
  name: ""
  # Vault Kubernetes auth and cloud workload identity hang off annotations, e.g.
  #   iam.gke.io/gcp-service-account: godwit@project.iam.gserviceaccount.com
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/godwit
  annotations: {}
  # false takes the generic, audience-less token out of the pod; godwit calls no Kubernetes API.
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8474
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: godwit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: godwit-tls
  #   hosts: [godwit.example.com]

# The Gateway API alternative to ingress. The Gateway and its listeners are the platform's, not the chart's.
httpRoute:
  enabled: false
  # gateway.networking.k8s.io/v1 since Gateway API 1.0; v1beta1 for older CRDs.
  apiVersion: gateway.networking.k8s.io/v1
  annotations: {}
  labels: {}
  # Required when enabled: the Gateway (or ListenerSet) this route attaches to.
  parentRefs: []
  # - name: internal
  #   namespace: gateway-system
  #   sectionName: https
  hostnames: []
  # - godwit.example.com
  # Verbatim rules; one with no backendRefs gets the godwit Service. Empty renders one PathPrefix / rule.
  rules: []
  # - matches:
  #     - path: { type: PathPrefix, value: /ui }
  #   filters: []

# Prometheus Operator scrape of /metrics (needs the ServiceMonitor CRD).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  failureThreshold: 3

# The scheduler lease of an in-flight run expires after this and another replica resumes it.
terminationGracePeriodSeconds: 30

priorityClassName: ""
revisionHistoryLimit: 10
# maxUnavailable: 0 keeps every replica that holds a run lease alive until its replacement is ready.
updateStrategy: {}
# type: RollingUpdate
# rollingUpdate:
#   maxUnavailable: 0
#   maxSurge: 1

nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
# Keep replicas on different nodes: "soft", "hard" or "" to disable. Ignored when affinity is set.
podAntiAffinity: soft
affinity: {}

# Targets and credential stores are control-plane rows, registered through the API, not chart values.
