# The ordinary shape: ingress-nginx, a Secret created by hand or by a sealed-secrets
# controller, targets registered from the operator's laptop. No Gateway API CRDs.
replicaCount: 2

image:
  tag: sha-1a2b3c4
  pullPolicy: IfNotPresent

existingSecret:
  name: godwit

serve:
  scratch:
    enabled: true
  ui:
    enabled: true
    basicAuth: true
    origins: ["https://godwit.example.com"]

notifications:
  publicUrl: https://godwit.example.com

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
  hosts:
    - host: godwit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: godwit-tls
      hosts: [godwit.example.com]

serviceMonitor:
  enabled: true

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: '{{ include "godwit.fullname" . }}-alerts'
    data:
      note: rendered with the release context
