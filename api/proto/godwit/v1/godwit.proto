syntax = "proto3";

package godwit.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/SamuelMolling/godwit/gen/godwit/v1;godwitv1";

message MigrationFile {
  string name = 1;
  string body = 2;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_SUCCEEDED = 3;
  RUN_STATE_FAILED = 4;
  RUN_STATE_NEEDS_ATTENTION = 5;
  // Contract phase held until ConfirmRollout.
  RUN_STATE_AWAITING_CONTRACT = 6;
  // Undone by a later RevertRun.
  RUN_STATE_REVERTED = 7;
}

message Run {
  string id = 1;
  string target = 2;
  RunState state = 3;
  string error = 4;
  int32 attempts = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  string rollout = 8;
  // "expand" or "contract".
  string phase = 9;
  // Id of the run this one reverts, when it is a revert.
  string reverts = 10;
  // Per-run timeout overrides as given at creation ("2s", "5m"); empty means the target's setting.
  string lock_timeout = 11;
  string statement_timeout = 12;
  // "migrate" or "baseline".
  string kind = 13;
  // Name of the token that created the run ("anonymous" for unnamed tokens).
  string created_by = 14;
  // Free-text provenance given at creation, e.g. github.com/org/repo@<sha>:db/migrations.
  string source = 15;
  // Id of the stored plan this run applies; empty for implicit runs.
  string plan_id = 16;
  // Earliest time the scheduler will pick the run up again after a transient failure; unset when not waiting.
  google.protobuf.Timestamp not_before = 17;
  // Transient failures the scheduler retried on its own.
  int32 retries = 18;
  // What the newest statement reported; set only while a run is executing, cleared when the attempt starts or ends.
  RunProgress progress = 19;
}

// RunProgress is how far the statement a run is executing has got.
message RunProgress {
  string migration = 1;
  int32 statement = 2;
  string phase = 3;
  int64 rows_done = 4;
  // Estimate taken when the backfill started; 0 when unknown.
  int64 rows_total = 5;
  int32 batches = 6;
}

message RegisterTargetRequest {
  string name = 1;
  // Credential provider: "static" (dsn, encrypted at rest), "kubernetes" (secret_path) or "vault" (vault_path).
  string provider = 2;
  string dsn = 3;
  string secret_path = 4;
  // Vault secret path under /v1, e.g. secret/data/app or database/creds/app.
  string vault_path = 5;
  // Optional DSN template over the secret's fields, e.g. postgres://{{username}}:{{password}}@db/app; default {{dsn}}.
  string vault_template = 6;
  // lock_timeout for every statement on this target ("5s", "2m"); default 5s.
  string lock_timeout = 7;
  // statement_timeout for every statement on this target; default 0 (disabled).
  string statement_timeout = 8;
  // Refuse runs whose migration set has no stored plan.
  bool require_plan = 9;
  // Default for `-- godwit: change-type` on this target: keep the pre-swap column as the rollback (true, godwit's
  // own default) or drop it in the contract phase. A directive's own keep-old= still wins. Unset leaves the default.
  optional bool keep_old = 11;
  // search_path for every session godwit opens on this target, e.g. "app,public"; unquoted schema names, comma separated.
  // Empty keeps the target role's own default; "godwit" is refused, the journal lives there and is always qualified.
  string search_path = 10;
}

message RegisterTargetResponse {}

message CreateRunRequest {
  string target = 1;
  repeated MigrationFile files = 2;
  // Hazard codes the author accepts; unacknowledged hazards are refused.
  repeated string acknowledge_hazards = 3;
  // Skip the scratch-database validation.
  bool skip_validation = 4;
  // "direct" (default) or "expand-contract".
  string rollout = 5;
  // Override the target's lock_timeout for this run ("5s", "2m").
  string lock_timeout = 6;
  // Override the target's statement_timeout for this run; "0" disables it.
  string statement_timeout = 7;
  // Apply pending versions older than the newest applied one instead of refusing them.
  bool allow_out_of_order = 8;
  // Where the files come from, kept on the run for provenance (free text).
  string source = 9;
  // Bind this stored plan explicitly; files may be omitted (the plan supplies them) and target must match when set.
  string plan_id = 10;
  // Stop at this version: only migrations at or below it run, the rest are reported as withheld. Zero runs everything.
  int64 to_version = 11;
}

message CreateRunResponse {
  string run_id = 1;
  // Id of the plan the run was bound to; empty for implicit runs.
  string plan_id = 2;
  // True when run_id names an existing run for the same files instead of a new one.
  bool reattached = 3;
}

message PlanRunRequest {
  string target = 1;
  repeated MigrationFile files = 2;
  repeated string acknowledge_hazards = 3;
  bool skip_validation = 4;
  string rollout = 5;
  bool allow_out_of_order = 6;
  // Store the plan so a later CreateRun with the same migration set binds to it.
  bool persist = 7;
  // Free-text provenance stored with the plan, e.g. github.com/org/repo@<sha>:db/migrations.
  string source = 8;
  // Stop at this version: only migrations at or below it are planned, the rest are reported as withheld. Zero plans everything.
  int64 to_version = 9;
}

message PlanObservation {
  // sha256 over the target's live migration history (version and checksum, ascending).
  string history_hash = 1;
  string schema_fingerprint = 2;
  int32 applied_count = 3;
  int64 newest_applied = 4;
  google.protobuf.Timestamp at = 5;
  // The search_path the target's sessions actually resolve under (current_schemas), which the plan was taken with.
  string search_path = 6;
}

// Error detail on failed_precondition: the stored plan no longer matches the target.
message PlanStale {
  string plan_id = 1;
  // "history", "schema", "order", "validation" or "content".
  string reason = 2;
  repeated string history_added = 3;
  repeated string history_removed = 4;
  string schema_diff = 5;
  string hint = 6;
}

// Error detail on failed_precondition: the target requires a stored plan and none matches the set.
message PlanRequired {
  string target = 1;
  string key = 2;
  repeated string nearest_plan_ids = 3;
  string files_diff = 4;
}

message PlannedHazard {
  string code = 1;
  string detail = 2;
  string recipe = 3;
}

// PlannedBatch describes a statement the executor runs as a resumable loop over a journalled cursor.
message PlannedBatch {
  // Cursor column, already quoted.
  string key = 1;
  // "int", "uuid" or "text": how the cursor is carried between batches.
  string kind = 2;
  // Rows touched per transaction.
  int32 size = 3;
  // Wait between batches ("100ms"); empty means none.
  string pause = 4;
}

// PlannedAssert is the condition an `-- godwit: assert` statement states about the value its query returns.
message PlannedAssert {
  // Comparison: "=", "<>", "!=", "<", "<=", ">" or ">=".
  string op = 1;
  // "int" or "bool": how the returned value is read.
  string kind = 2;
  // The value the comparison is against, as written.
  string value = 3;
}

message PlannedStatement {
  string sql = 1;
  // Runs outside a transaction (CREATE INDEX CONCURRENTLY, VACUUM, ...).
  bool no_tx = 2;
  repeated PlannedHazard hazards = 3;
  // "expand", "contract", or empty for a statement that follows the migration's own phase.
  string phase = 4;
  // Set when the statement is a batched backfill rather than a single execution.
  PlannedBatch batch = 5;
  // Set when the statement is a data condition the run checks instead of SQL it applies.
  PlannedAssert assert = 6;
}

message PlannedMigration {
  int64 version = 1;
  string name = 2;
  string checksum = 3;
  // Already in the target's history; the executor would skip it.
  bool applied = 4;
  // "expand" or "contract": the phase the rollout policy would put it in.
  string phase = 5;
  repeated PlannedStatement statements = 6;
  // Its effect is already in the target's schema; applying the plan records it without executing.
  bool already_applied = 7;
  // The schema lines the migration adds ("+ ") or removes ("- "), when already_applied.
  string effect = 8;
  // Why detection was refused for this migration, when it was.
  string note = 9;
  // Has no version: an R__ file, applied after the versioned ones whenever its content differs from what the target recorded.
  bool repeatable = 10;
  // The `-- godwit:` lines the file carries, as written.
  repeated string directives = 11;
  // Its statements were generated from those directives against the target's catalog.
  bool expanded = 12;
  // What the expansion leaves behind or costs, one line each.
  repeated string notes = 13;
  // Kept out of this plan by a version target: it is in the directory, it is not in the run.
  bool withheld = 14;
}

message PlanRunResponse {
  string target = 1;
  string rollout = 2;
  repeated PlannedMigration migrations = 3;
  // Whether the plan was replayed on a scratch database (false with skip_validation or no validator).
  bool validated = 4;
  // Set when persist was requested.
  string plan_id = 5;
  string plan_key = 6;
  PlanObservation observed = 7;
  // Schema changes on the target that no run made, as +/- lines; empty without a baseline.
  string drift = 8;
}

message Plan {
  string id = 1;
  string target = 2;
  string key = 3;
  string rollout = 4;
  // "ready", "bound" or "superseded".
  string state = 5;
  PlanObservation observed = 6;
  string drift = 7;
  repeated PlannedMigration migrations = 8;
  bool validated = 9;
  repeated string acknowledged_hazards = 10;
  bool allow_out_of_order = 11;
  string created_by = 12;
  string source = 13;
  google.protobuf.Timestamp created_at = 14;
  // The run that applied the plan, when bound.
  string run_id = 15;
  // The plan that replaced this one, when superseded.
  string superseded_by = 16;
}

message GetPlanRequest {
  string plan_id = 1;
  // Also return the migration files stored with the plan.
  bool include_files = 2;
}

message GetPlanResponse {
  Plan plan = 1;
  // The migration directory the plan was taken from, when include_files is set: a snapshot of that
  // moment, not of the repository now. By name.
  repeated MigrationFile files = 2;
}

message ListPlansRequest {
  string target = 1;
  // Page size; 100 when zero.
  int32 limit = 2;
}

message ListPlansResponse {
  // Newest first.
  repeated Plan plans = 1;
}

// DiffBase is the schema the desired one is compared against.
enum DiffBase {
  DIFF_BASE_UNSPECIFIED = 0;
  // The target's live schema.
  DIFF_BASE_LIVE = 1;
  // The schema the committed migration files produce on top of the target's recorded history.
  DIFF_BASE_FILES = 2;
}

message DiffRequest {
  string target = 1;
  // The whole desired database as DDL (CREATE TABLE ...); applied on an empty scratch database with the target's search_path.
  string schema = 2;
  // Defaults to DIFF_BASE_LIVE.
  DiffBase base = 3;
  // The committed migration directory. Required by DIFF_BASE_FILES; under DIFF_BASE_LIVE its R__ pairs are
  // built on the desired schema, and it is required whenever the target records repeatable migrations.
  repeated MigrationFile files = 4;
}

message DiffResponse {
  string target = 1;
  // Takes the target from its live schema to the desired one; empty when they already match.
  string up_sql = 2;
  // Takes the desired schema back to the live one.
  string down_sql = 3;
  // up_sql classified statement by statement, with hazards and recipes.
  repeated PlannedStatement statements = 4;
  PlanObservation observed = 5;
  // Schema changes on the target that no run made, as +/- lines; they are part of up_sql's starting point.
  string drift = 6;
  // The objects the request's repeatable migrations build; they are part of the desired schema, so up_sql
  // neither drops nor recreates them while an R__ file still declares them.
  repeated string repeatable_objects = 7;
}

message CheckDriftRequest {
  string target = 1;
}

message CheckDriftResponse {
  bool drifted = 1;
  string diff = 2;
}

message ListDriftEventsRequest {
  string target = 1;
}

message DriftEvent {
  int64 id = 1;
  string target = 2;
  string diff = 3;
  google.protobuf.Timestamp detected_at = 4;
  google.protobuf.Timestamp resolved_at = 5;
}

message ListDriftEventsResponse {
  repeated DriftEvent events = 1;
}

message AcceptBaselineRequest {
  string target = 1;
}

message AcceptBaselineResponse {}

message BaselineTargetRequest {
  string target = 1;
  repeated MigrationFile files = 2;
  // Every migration with a version at or below this one is marked applied without running.
  int64 version = 3;
}

message BaselineTargetResponse {
  string run_id = 1;
}

message ListTargetsRequest {}

// TargetSummary is what the control plane knows about a target without connecting to it.
message TargetSummary {
  string name = 1;
  string provider = 2;
  // The target's registered settings; empty timeouts and search_path inherit the role's defaults.
  string search_path = 3;
  string lock_timeout = 4;
  string statement_timeout = 5;
  bool require_plan = 6;
  // Whether a change-type keeps the old column as its rollback; true unless keep_old is registered as false.
  bool keep_old = 7;
  Run last_run = 8;
  bool unresolved_drift = 9;
  // Stored plans still bindable on the target.
  int32 ready_plans = 10;
  // Distinct versions the target's runs applied to completion and no revert undid, whatever state those runs ended in.
  int32 applied_count = 11;
  // Runs waiting for a human: needs_attention or awaiting_contract.
  int32 attention_runs = 12;
}

message ListTargetsResponse {
  // By name.
  repeated TargetSummary targets = 1;
}

message GetTargetStatusRequest {
  string target = 1;
  // Optional: when given, versions missing on the target and repeatables whose content changed are reported as pending,
  // and checksums are compared.
  repeated MigrationFile files = 2;
}

message AppliedMigration {
  int64 version = 1;
  string name = 2;
  string checksum = 3;
  google.protobuf.Timestamp applied_at = 4;
  bool checksum_mismatch = 5;
  // Recorded in godwit.repeatables under name, with no version; the file matches what is recorded.
  bool repeatable = 6;
}

message PendingMigration {
  int64 version = 1;
  string name = 2;
  // An R__ file whose content differs from what the target recorded, or that it never recorded.
  bool repeatable = 3;
}

message DriftBaseline {
  google.protobuf.Timestamp taken_at = 1;
  string run_id = 2;
  bool unresolved_drift = 3;
}

message GetTargetStatusResponse {
  string target = 1;
  string provider = 2;
  string lock_timeout = 3;
  string statement_timeout = 4;
  repeated AppliedMigration applied = 5;
  repeated PendingMigration pending = 6;
  Run last_run = 7;
  DriftBaseline drift_baseline = 8;
  // Stored plans still bindable on the target.
  int32 ready_plans = 9;
  // The search_path declared on the target; empty when it inherits the role's default.
  string search_path = 10;
}

message ListAuditRequest {
  string target = 1;
  string run_id = 2;
  // Newest entries first; 100 when zero.
  int32 limit = 3;
}

message AuditEntry {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  // Token name behind the call.
  string actor = 3;
  // target.register, target.baseline, run.create, run.revert, run.resume, run.park, run.confirm, drift.accept, plan.create or plan.supersede.
  string action = 4;
  string run_id = 5;
  string target = 6;
  // Short key=value summary of the request; never a migration body or a secret.
  string detail = 7;
}

message ListAuditResponse {
  repeated AuditEntry entries = 1;
}

message GetRunRequest {
  string run_id = 1;
  // Also return the migration files the run carried.
  bool include_files = 2;
}

message GetRunResponse {
  Run run = 1;
  // What the run actually put into the target's history, in the order it applied them.
  repeated RunMigration applied = 2;
  // The migration directory the run carried, when include_files is set: a snapshot of that moment,
  // not of the repository now. By name.
  repeated MigrationFile files = 3;
}

// RunMigration is one migration a run applied, as recorded in the control plane's ledger.
message RunMigration {
  // Migration id: <version>_<name>, or R__<name>.
  string migration = 1;
  google.protobuf.Timestamp applied_at = 2;
  // Id of the revert run that undid it; empty while it still stands.
  string reverted_by = 3;
  // Its contract phase never ran: applied but not recorded on the target.
  bool held = 4;
}

message ListRunsRequest {
  string target = 1;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message WatchRunRequest {
  string run_id = 1;
}

message WatchRunResponse {
  Run run = 1;
}

message ResumeRunRequest {
  string run_id = 1;
}

message ResumeRunResponse {}

message ParkRunRequest {
  string run_id = 1;
  string reason = 2;
}

message ParkRunResponse {}

message ConfirmRolloutRequest {
  string run_id = 1;
}

message ConfirmRolloutResponse {}

message RevertRunRequest {
  // Run to revert; empty picks the newest un-reverted run on target.
  string run_id = 1;
  repeated string acknowledge_hazards = 2;
  bool skip_validation = 3;
  // Override the target's lock_timeout for the revert run ("5s", "2m").
  string lock_timeout = 4;
  // Override the target's statement_timeout for the revert run; "0" disables it.
  string statement_timeout = 5;
  // Required when run_id is empty, and checked against the run's own target otherwise.
  string target = 6;
  // Return the plan without queueing anything.
  bool dry_run = 7;
  // Revert a run that is not the newest un-reverted one on its target.
  bool force = 8;
  // Run a plan that drops a table or column still holding rows.
  bool allow_data_loss = 9;
}

// DataLoss is a table or column the revert would drop while it still holds rows.
message DataLoss {
  string migration = 1;
  // "table" or "column".
  string kind = 2;
  // schema.table, or schema.table.column.
  string object = 3;
  // Rows for a table; non-null values for a column.
  int64 rows = 4;
}

message RevertRunResponse {
  // Id of the new run applying the down migrations; empty on a dry run.
  string run_id = 1;
  // Run being reverted.
  string reverts = 2;
  string target = 3;
  // The down side of every migration the run applied, in reverse order of application.
  repeated PlannedMigration migrations = 4;
  // What the plan would destroy; non-empty only when allow_data_loss let it through.
  repeated DataLoss data_loss = 5;
  // The run was not the newest un-reverted one and force allowed it anyway.
  bool forced = 6;
}

service GodwitService {
  rpc RegisterTarget(RegisterTargetRequest) returns (RegisterTargetResponse);
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  // Runs CreateRun's admission (hazard gate, order guard, scratch validation) and returns the plan without queueing anything.
  rpc PlanRun(PlanRunRequest) returns (PlanRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);
  rpc ParkRun(ParkRunRequest) returns (ParkRunResponse);
  rpc ConfirmRollout(ConfirmRolloutRequest) returns (ConfirmRolloutResponse);
  rpc RevertRun(RevertRunRequest) returns (RevertRunResponse);
  rpc CheckDrift(CheckDriftRequest) returns (CheckDriftResponse);
  rpc ListDriftEvents(ListDriftEventsRequest) returns (ListDriftEventsResponse);
  rpc AcceptBaseline(AcceptBaselineRequest) returns (AcceptBaselineResponse);
  rpc BaselineTarget(BaselineTargetRequest) returns (BaselineTargetResponse);
  rpc GetTargetStatus(GetTargetStatusRequest) returns (GetTargetStatusResponse);
  // Summarises every registered target from the control plane alone, without opening a connection to any of them.
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse);
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  // Generates the migration between the target's live schema and a desired DDL, in both directions.
  rpc Diff(DiffRequest) returns (DiffResponse);
}
